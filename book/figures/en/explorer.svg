<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="760" height="250" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="380.0" y="24" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">what an online compiler explorer shows</text><rect x="30" y="44" width="330" height="170" fill="none" stroke="#111" stroke-width="1.8"/><rect x="400" y="44" width="330" height="170" fill="none" stroke="#111" stroke-width="1.8"/><text x="195" y="64" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">the C you wrote</text><text x="565" y="64" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">the machine code the compiler produced</text><line x1="30" y1="72" x2="360" y2="72" stroke="#111" stroke-width="1"/><line x1="400" y1="72" x2="730" y2="72" stroke="#111" stroke-width="1"/><line x1="48" y1="90" x2="200" y2="90" stroke="#111" stroke-width="1.4" opacity="0.85"/><line x1="418" y1="90" x2="560" y2="90" stroke="#111" stroke-width="1.4" opacity="0.6"/><line x1="305" y1="90" x2="412" y2="90" stroke="#111" stroke-width="1.2" marker-end="url(#a)"/><line x1="48" y1="120" x2="260" y2="120" stroke="#111" stroke-width="3" opacity="0.85"/><line x1="418" y1="116" x2="620" y2="116" stroke="#111" stroke-width="1.4" opacity="0.6"/><line x1="418" y1="138" x2="560" y2="138" stroke="#111" stroke-width="1.4" opacity="0.6"/><line x1="365" y1="120" x2="412" y2="116" stroke="#111" stroke-width="2.0" marker-end="url(#a)"/><line x1="48" y1="150" x2="200" y2="150" stroke="#111" stroke-width="1.4" opacity="0.85"/><line x1="418" y1="164" x2="620" y2="164" stroke="#111" stroke-width="1.4" opacity="0.6"/><line x1="305" y1="150" x2="412" y2="164" stroke="#111" stroke-width="1.2" marker-end="url(#a)"/><line x1="48" y1="180" x2="260" y2="180" stroke="#111" stroke-width="1.4" opacity="0.85"/><line x1="418" y1="186" x2="560" y2="186" stroke="#111" stroke-width="1.4" opacity="0.6"/><line x1="418" y1="202" x2="590" y2="202" stroke="#111" stroke-width="1.4" opacity="0.6"/><line x1="365" y1="180" x2="412" y2="186" stroke="#111" stroke-width="1.2" marker-end="url(#a)"/><text x="380.0" y="238" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#111">you see how one line becomes several, and which lines vanish — chapter 13's optimization, visible.</text></svg>