# gate.conf — read by scripts/gate.sh (KEY=value, one per line, no quotes needed). Every key is optional.
# TEST_CMD     the project's test command, run at tier t2 (example: make test)
# DOC_GLOBS    extra path globs treated as documentation (space-separated)
# SCRIPT_GLOBS extra path globs treated as scripts
# CONTEXT_BUDGET  default-context budget in bytes for scripts/context-budget.sh
#                 (kit default 16384). Set the measured size as a baseline when a
#                 project is larger today, and lower it as CONTEXT.md is trimmed.
TEST_CMD=
DOC_GLOBS=
SCRIPT_GLOBS=
CONTEXT_BUDGET=
