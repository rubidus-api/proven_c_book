# gate.conf — read by scripts/gate.sh (KEY=value, one per line, no quotes needed). Every key is optional.
# TEST_CMD     the project's test command, run at tier t2 (example: make test)
# NO_TESTS_REASON  why there is no TEST_CMD (example: the suite runs in project-check.sh);
#              t2 prints it instead of "ok", and fails when both are empty
# CONTEXT_BUDGET  default-context budget in bytes for scripts/context-budget.sh
#                 (empty: the script's default). Set the measured size as a baseline
#                 when a project is larger today, and lower it as CONTEXT.md is trimmed.
# SOT_FILE     registry read by scripts/sot-check.sh (empty: docs/agents/state.md)
# SOT_COPIES   copy=source pairs that must stay byte-identical (space-separated)
# SOT_SKIP     extra history paths sot-check.sh skips (space-separated)
# SOT_ENFORCE  1 makes sot-check.sh fail on a finding; empty reports only
# KIT_PROFILE  standard (default) or adapted. Adapted keeps the common routing and
#              core tools without requiring every software/release document.
# KIT_OPS_DIR  optional operating-docs directory, relative to the project root or
#              absolute locally. Prefer a relative sibling path for portability.
TEST_CMD=
NO_TESTS_REASON=a book; its checks run in scripts/project-check.sh, which t2 runs
CONTEXT_BUDGET=
SOT_FILE=
SOT_COPIES=
SOT_SKIP=
SOT_ENFORCE=
KIT_PROFILE=
KIT_OPS_DIR=
