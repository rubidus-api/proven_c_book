<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="760" height="300" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="380.0" y="26" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">가상 주소가 물리 주소가 되기까지</text><text x="115.0" y="48" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111">가상 쪽 (프로그램이 보는 것)</text><rect x="40" y="64" width="150" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="115.0" y="89" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#111">가상 쪽 0</text><rect x="40" y="112" width="150" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="115.0" y="137" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#111">가상 쪽 1</text><rect x="40" y="160" width="150" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="115.0" y="185" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#111">가상 쪽 2</text><rect x="40" y="208" width="150" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="115.0" y="233" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#111">가상 쪽 3</text><text x="645.0" y="48" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111">물리 쪽 (DRAM 의 자리)</text><rect x="570" y="64" width="150" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="645.0" y="89" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#111">물리 쪽 7</text><rect x="570" y="112" width="150" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="645.0" y="137" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#111">물리 쪽 2</text><rect x="570" y="160" width="150" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="645.0" y="185" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#111">물리 쪽 9</text><rect x="570" y="208" width="150" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="645.0" y="233" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#111">물리 쪽 4</text><rect x="299.05078125" y="58" width="161.8984375" height="196" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="5 4"/><text x="380.0" y="148.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">쪽 표</text><text x="380.0" y="170.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#444">어느 가상 쪽이 어느 물리 쪽인가</text><line x1="190" y1="84.0" x2="299.05078125" y2="84.0" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="460.94921875" y1="132.0" x2="570" y2="132.0" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="190" y1="132.0" x2="299.05078125" y2="132.0" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="460.94921875" y1="228.0" x2="570" y2="228.0" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="190" y1="180.0" x2="299.05078125" y2="180.0" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="460.94921875" y1="84.0" x2="570" y2="84.0" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="190" y1="228.0" x2="299.05078125" y2="228.0" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="460.94921875" y1="180.0" x2="570" y2="180.0" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text x="380.0" y="266" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#444">이어져 있던 것이 흩어진다 --- 가상에서 이웃이어도 물리에서는 이웃이 아니다.</text><text x="380.0" y="286" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#444">그래서 「주소가 가깝다」가 「빠르다」를 뜻하지 않는다.</text></svg>