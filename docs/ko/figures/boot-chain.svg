<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="780" height="430" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="390.0" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">부팅은 사슬이다 --- 각 칸은 다음 칸을 찾아 검사하고 넘긴다</text><text x="40" y="56" font-size="12" font-weight="bold" text-anchor="start" fill="#111">도스 (BIOS)</text><rect x="40" y="70" width="150" height="62" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="115" y="96" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">전원·POST</text><line x1="190" y1="101" x2="228" y2="101" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="230" y="70" width="150" height="62" fill="none" stroke="#111" stroke-width="1.6"/><text x="305" y="90" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">부팅 섹터</text><text x="305" y="106" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">0x7C00</text><line x1="380" y1="101" x2="418" y2="101" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="420" y="70" width="150" height="62" fill="none" stroke="#111" stroke-width="1.6"/><text x="495" y="90" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">IO.SYS</text><text x="495" y="106" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">MSDOS.SYS</text><line x1="570" y1="101" x2="608" y2="101" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="610" y="70" width="150" height="62" fill="none" stroke="#111" stroke-width="1.6"/><text x="685" y="96" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">COMMAND.COM</text><text x="40" y="176" font-size="12" font-weight="bold" text-anchor="start" fill="#111">리눅스 (UEFI)</text><rect x="40" y="190" width="150" height="62" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="115" y="216" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">전원·펌웨어</text><line x1="190" y1="221" x2="228" y2="221" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="230" y="190" width="150" height="62" fill="none" stroke="#111" stroke-width="1.6"/><text x="305" y="210" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">ESP 의 .efi</text><text x="305" y="226" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">(PE 형식)</text><line x1="380" y1="221" x2="418" y2="221" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="420" y="190" width="150" height="62" fill="none" stroke="#111" stroke-width="1.6"/><text x="495" y="216" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">커널 + initramfs</text><line x1="570" y1="221" x2="608" y2="221" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="610" y="190" width="150" height="62" fill="none" stroke="#111" stroke-width="1.6"/><text x="685" y="216" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">PID 1 (init)</text><text x="40" y="296" font-size="12" font-weight="bold" text-anchor="start" fill="#111">임베디드 RTOS</text><rect x="40" y="310" width="150" height="62" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="115" y="336" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">전원·리셋 벡터</text><line x1="190" y1="341" x2="228" y2="341" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="230" y="310" width="150" height="62" fill="none" stroke="#111" stroke-width="1.6"/><text x="305" y="336" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">부트 ROM / SPL</text><line x1="380" y1="341" x2="418" y2="341" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="420" y="310" width="150" height="62" fill="none" stroke="#111" stroke-width="1.6"/><text x="495" y="330" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">부트로더</text><text x="495" y="346" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">(서명 검사)</text><line x1="570" y1="341" x2="608" y2="341" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="610" y="310" width="150" height="62" fill="none" stroke="#111" stroke-width="1.6"/><text x="685" y="330" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">펌웨어 이미지</text><text x="685" y="346" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">= 앱 + 커널</text><rect x="40" y="380" width="700" height="40" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="390.0" y="396" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">각 칸이 하는 일은 같다 --- 다음 것을 찾고, 읽어 싣고, 맞는지 보고, 제어를 넘긴다</text><text x="390.0" y="412" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">넘길 때 앞 칸은 대개 사라진다 --- 그래서 무엇을 물려주는지가 규약이 된다(명령줄, 메모리 맵, 장치 트리)</text></svg>