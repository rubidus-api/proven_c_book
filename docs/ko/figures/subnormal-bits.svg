<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="800" height="300" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="185" y="34" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#111">부호</text><text x="263.0" y="34" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#111">지수 칸 (11)</text><text x="355" y="34" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#111">숨은 비트</text><text x="476.0" y="34" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#111">가수 칸 (52)</text><text x="586" y="34" font-size="11.5" font-weight="bold" text-anchor="start" fill="#111">값</text><text x="20" y="76" font-size="12" font-weight="bold" text-anchor="start" fill="#111">가장 작은 정규수</text><text x="20" y="92" font-size="11" font-weight="normal" text-anchor="start" fill="#444">DBL_MIN</text><rect x="172" y="56" width="26" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="185" y="81" font-size="13" font-weight="normal" text-anchor="middle" fill="#111">0</text><rect x="198" y="56" width="130" height="40" fill="url(#hatch)" stroke="#111" stroke-width="1.6"/><text x="263.0" y="81" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">00000000001</text><rect x="340" y="56" width="30" height="40" fill="none" stroke="#111" stroke-width="1.2" stroke-dasharray="4 3"/><text x="355" y="81" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">1.</text><rect x="378" y="56" width="196" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="476.0" y="81" font-size="13" font-weight="normal" text-anchor="middle" fill="#111">0000 0000 … 0000</text><text x="586" y="81" font-size="12.5" font-weight="normal" text-anchor="start" fill="#111">1.000…0 × 2^-1022</text><text x="20" y="138" font-size="12" font-weight="bold" text-anchor="start" fill="#111">가장 큰 비정규수</text><rect x="172" y="118" width="26" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="185" y="143" font-size="13" font-weight="normal" text-anchor="middle" fill="#111">0</text><rect x="198" y="118" width="130" height="40" fill="url(#hatch)" stroke="#111" stroke-width="1.6"/><text x="263.0" y="143" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">00000000000</text><rect x="340" y="118" width="30" height="40" fill="none" stroke="#111" stroke-width="1.2" stroke-dasharray="4 3"/><text x="355" y="143" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">0.</text><rect x="378" y="118" width="196" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="476.0" y="143" font-size="13" font-weight="normal" text-anchor="middle" fill="#111">1111 1111 … 1111</text><text x="586" y="143" font-size="12.5" font-weight="normal" text-anchor="start" fill="#111">0.111…1 × 2^-1022</text><text x="20" y="200" font-size="12" font-weight="bold" text-anchor="start" fill="#111">가장 작은 비정규수</text><text x="20" y="216" font-size="11" font-weight="normal" text-anchor="start" fill="#444">DBL_TRUE_MIN</text><rect x="172" y="180" width="26" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="185" y="205" font-size="13" font-weight="normal" text-anchor="middle" fill="#111">0</text><rect x="198" y="180" width="130" height="40" fill="url(#hatch)" stroke="#111" stroke-width="1.6"/><text x="263.0" y="205" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">00000000000</text><rect x="340" y="180" width="30" height="40" fill="none" stroke="#111" stroke-width="1.2" stroke-dasharray="4 3"/><text x="355" y="205" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">0.</text><rect x="378" y="180" width="196" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="476.0" y="205" font-size="13" font-weight="normal" text-anchor="middle" fill="#111">0000 0000 … 0001</text><text x="586" y="205" font-size="12.5" font-weight="normal" text-anchor="start" fill="#111">0.000…1 × 2^-1022 = 2^-1074</text><text x="20" y="270" font-size="11.5" font-weight="normal" text-anchor="start" fill="#444">지수 칸이 1에서 0으로 내려가도 실제 지수는 -1022 그대로다. 바뀌는 것은 숨은 비트(1 → 0)뿐이다.</text><text x="20" y="290" font-size="11.5" font-weight="normal" text-anchor="start" fill="#444">그래서 가장 큰 비정규수와 가장 작은 정규수는 꼭 한 눈금(2^-1074) 떨어진 이웃이 된다.</text></svg>