<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="760" height="350" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="380.0" y="24" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">깃발이 보이면 데이터도 보이는가</text><text x="200" y="60" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">순서를 안 묶으면</text><rect x="30" y="72" width="160" height="96" fill="#f7f7f7" stroke="#111" stroke-width="1.6"/><text x="110" y="92" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#111">쓰는 쪽</text><text x="110" y="114" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">data = 42</text><text x="110" y="134" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">flag = 1</text><rect x="210" y="72" width="160" height="96" fill="#f7f7f7" stroke="#111" stroke-width="1.6"/><text x="290" y="92" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#111">읽는 쪽</text><text x="290" y="114" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">flag 를 본다</text><text x="290" y="134" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">data 를 읽는다</text><line x1="190" y1="120" x2="208" y2="120" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text x="200" y="188" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#c0392b">깃발이 먼저 보일 수 있다 → 옛 data 를 읽는다</text><text x="570" y="60" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">release / acquire 로 묶으면</text><rect x="400" y="72" width="160" height="96" fill="#f7f7f7" stroke="#111" stroke-width="1.6"/><text x="480" y="92" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#111">쓰는 쪽</text><text x="480" y="114" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">data = 42</text><text x="480" y="134" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">flag = 1</text><rect x="580" y="72" width="160" height="96" fill="#f7f7f7" stroke="#111" stroke-width="1.6"/><text x="660" y="92" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#111">읽는 쪽</text><text x="660" y="114" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">flag 를 본다</text><text x="660" y="134" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">data 를 읽는다</text><line x1="560" y1="120" x2="578" y2="120" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text x="570" y="188" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#2c6fbb">깃발이 보이면 그 앞의 쓰기도 보인다</text><rect x="400" y="210" width="340" height="74" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="5 4"/><text x="570" y="232" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#111">짝이 세우는 벽</text><text x="570" y="252" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">release: 앞의 쓰기가 아래로 못 내려간다</text><text x="570" y="270" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">acquire: 뒤의 읽기가 위로 못 올라간다</text><rect x="30" y="210" width="340" height="74" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="5 4"/><text x="200" y="232" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#111">누가 순서를 바꾸나</text><text x="200" y="252" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">컴파일러가 바꾼다 (한 갈래만 보므로 문제없다고 판단)</text><text x="200" y="270" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">CPU 도 바꾼다 (쓰기 버퍼·비순차 실행)</text><text x="380.0" y="320" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#111">벽은 한쪽만 세워도 소용없다 --- 쓰는 쪽과 읽는 쪽이 짝을 이뤄야 한다</text></svg>