<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="760" height="350" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="380.0" y="24" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">통상 산술 변환 — 두 피연산자를 한 타입으로 맞추는 순서</text><rect x="90" y="48" width="380" height="46" fill="none" stroke="#111" stroke-width="1.6"/><text x="104" y="68" font-size="12" font-weight="bold" text-anchor="start" fill="#111">1. 정수 승격</text><text x="104" y="86" font-size="11" font-weight="normal" text-anchor="start" fill="#444">int 보다 좁은 타입은 먼저 int(또는 unsigned int)로</text><line x1="280.0" y1="94" x2="280.0" y2="116" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="90" y="116" width="380" height="46" fill="none" stroke="#111" stroke-width="1.6"/><text x="104" y="136" font-size="12" font-weight="bold" text-anchor="start" fill="#111">2. 부호가 같은가?</text><text x="104" y="154" font-size="11" font-weight="normal" text-anchor="start" fill="#444">같으면 순위가 큰 쪽으로 맞춘다</text><line x1="280.0" y1="162" x2="280.0" y2="184" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="90" y="184" width="380" height="46" fill="none" stroke="#111" stroke-width="1.6"/><text x="104" y="204" font-size="12" font-weight="bold" text-anchor="start" fill="#111">3. 부호 없는 쪽의 순위가 크거나 같은가?</text><text x="104" y="222" font-size="11" font-weight="normal" text-anchor="start" fill="#444">그렇다면 부호 없는 쪽으로</text><line x1="280.0" y1="230" x2="280.0" y2="252" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="90" y="252" width="380" height="46" fill="none" stroke="#111" stroke-width="1.6"/><text x="104" y="272" font-size="12" font-weight="bold" text-anchor="start" fill="#111">4. 부호 있는 쪽이 상대의 모든 값을 담는가?</text><text x="104" y="290" font-size="11" font-weight="normal" text-anchor="start" fill="#444">담으면 부호 있는 쪽으로, 아니면 그 짝인 부호 없는 타입으로</text><rect x="510" y="48" width="200" height="250" fill="none" stroke="#111" stroke-width="1.2" stroke-dasharray="5 4"/><text x="610" y="72" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">보기</text><text x="526" y="100" font-size="11" font-weight="normal" text-anchor="start" fill="#111">int + unsigned</text><text x="526" y="122" font-size="11" font-weight="normal" text-anchor="start" fill="#111">→ 3번에서 멈춘다</text><text x="526" y="144" font-size="11" font-weight="normal" text-anchor="start" fill="#111">→ unsigned</text><text x="526" y="166" font-size="11" font-weight="normal" text-anchor="start" fill="#111"></text><text x="526" y="188" font-size="11" font-weight="normal" text-anchor="start" fill="#111">−1 이 아주 큰 수가</text><text x="526" y="210" font-size="11" font-weight="normal" text-anchor="start" fill="#111">되는 사고가 여기서</text><text x="380.0" y="336" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#111">네 단계를 순서대로 따른다. 대부분의 사고는 3번에서 난다.</text></svg>