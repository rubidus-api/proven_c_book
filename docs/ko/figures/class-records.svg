<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="800" height="300" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="400.0" y="24" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">부분 레코드를 이어 붙인 클래스 레코드 (Xt)</text><text x="140.0" y="76" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">Core 클래스</text><rect x="40" y="90" width="200" height="44" fill="none" stroke="#111" stroke-width="2.2"/><text x="140.0" y="117" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">Core 부분</text><text x="400.0" y="76" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">Composite 클래스</text><rect x="300" y="90" width="200" height="44" fill="url(#hatch)" stroke="#111" stroke-width="1.2"/><text x="400.0" y="117" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">Core 부분</text><rect x="300" y="134" width="200" height="44" fill="none" stroke="#111" stroke-width="2.2"/><text x="400.0" y="161" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">Composite 부분</text><text x="660.0" y="76" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">내 위젯 클래스</text><rect x="560" y="90" width="200" height="44" fill="url(#hatch)" stroke="#111" stroke-width="1.2"/><text x="660.0" y="117" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">Core 부분</text><rect x="560" y="134" width="200" height="44" fill="url(#hatch)" stroke="#111" stroke-width="1.2"/><text x="660.0" y="161" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">Composite 부분</text><rect x="560" y="178" width="200" height="44" fill="none" stroke="#111" stroke-width="2.2"/><text x="660.0" y="205" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">내 부분</text><line x1="580" y1="96" x2="496" y2="96" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="320" y1="96" x2="236" y2="96" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text x="430" y="50" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">첫 필드 superclass 가 부모 레코드를 가리킨다</text><text x="400.0" y="260" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">빗금은 부모의 모양을 따른 부분 --- 파생 레코드는 부모 레코드와 같은 모양을 맨 앞에 둔다</text><text x="400.0" y="282" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">그래서 내 위젯 클래스를 Core 클래스로 보아도 앞부분이 맞는다</text></svg>