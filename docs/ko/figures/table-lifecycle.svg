<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="800" height="250" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="400.0" y="24" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">표를 짓는 다섯 단계</text><rect x="20" y="70" width="128" height="62" fill="none" stroke="#111" stroke-width="1.6"/><text x="84.0" y="96" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">1. 등록</text><text x="84.0" y="116" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">이름 · 부모 · 자기 칸</text><line x1="150" y1="101.0" x2="176" y2="101.0" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="178" y="70" width="128" height="62" fill="none" stroke="#111" stroke-width="1.6"/><text x="242.0" y="96" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">2. 채우기</text><text x="242.0" y="116" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">기본값 → 부모 → 자기</text><line x1="308" y1="101.0" x2="334" y2="101.0" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="336" y="70" width="128" height="62" fill="none" stroke="#111" stroke-width="1.6"/><text x="400.0" y="96" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">3. 검증</text><text x="400.0" y="116" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">빈칸 없음 · 판 크기</text><line x1="466" y1="101.0" x2="492" y2="101.0" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="494" y="70" width="128" height="62" fill="none" stroke="#111" stroke-width="2.4"/><text x="558.0" y="96" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">4. 봉인</text><text x="558.0" y="116" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">const · 읽기 전용 쪽</text><line x1="624" y1="101.0" x2="650" y2="101.0" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="652" y="70" width="128" height="62" fill="none" stroke="#111" stroke-width="1.6"/><text x="716.0" y="96" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">5. 사용</text><text x="716.0" y="116" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">봉인한 표만 부른다</text><line x1="400.0" y1="134" x2="400.0" y2="180" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="322.0" y="182" width="156" height="34" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="400.0" y="204" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">빈칸이 있으면 내놓지 않는다</text><line x1="20" y1="56" x2="488" y2="56" stroke="#111" stroke-width="1" stroke-dasharray="3 3"/><text x="257.0" y="50" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">쓸 수 있는 동안</text><line x1="494" y1="56" x2="780" y2="56" stroke="#111" stroke-width="2.4"/><text x="637.0" y="50" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">읽기만</text><text x="400.0" y="236" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">여러 스레드라면 2~4 를 call_once 안에서, 또는 다 지은 뒤 주소만 원자적으로 내놓는다</text></svg>