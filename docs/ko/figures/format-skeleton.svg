<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="760" height="400" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="380.0" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">형식은 달라도 로더가 묻는 질문은 같다</text><text x="140" y="52" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">도스 .COM</text><rect x="40" y="64" width="200" height="44" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="140" y="91" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">(머리가 없다)</text><rect x="40" y="116" width="200" height="44" fill="none" stroke="#111" stroke-width="1.6"/><text x="140" y="143" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">코드 + 자료</text><text x="140" y="186" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">약속: 0x100 에 싣고</text><text x="140" y="202" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">거기서 시작한다</text><text x="380" y="52" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">ELF (리눅스)</text><rect x="280" y="64" width="200" height="44" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="380" y="91" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">ELF 머리</text><rect x="280" y="116" width="200" height="44" fill="none" stroke="#111" stroke-width="1.6"/><text x="380" y="143" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">프로그램 헤더 표</text><rect x="280" y="168" width="200" height="44" fill="none" stroke="#111" stroke-width="1.6"/><text x="380" y="195" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">구역들: .text .data .bss</text><rect x="280" y="220" width="200" height="44" fill="none" stroke="#111" stroke-width="1.6"/><text x="380" y="247" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">심볼·재배치·디버그</text><text x="620" y="52" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">PE (윈도우)</text><rect x="520" y="64" width="200" height="44" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="620" y="91" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">MZ 머리 + 도스 스텁</text><rect x="520" y="116" width="200" height="44" fill="none" stroke="#111" stroke-width="1.6"/><text x="620" y="143" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">PE 머리 + 구역 표</text><rect x="520" y="168" width="200" height="44" fill="none" stroke="#111" stroke-width="1.6"/><text x="620" y="195" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">구역들: .text .data .rdata</text><rect x="520" y="220" width="200" height="44" fill="none" stroke="#111" stroke-width="1.6"/><text x="620" y="247" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">임포트 표(IAT)·재배치</text><rect x="40" y="300" width="680" height="76" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="380.0" y="324" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">무엇을 어디에 싣는가 · 어디서 시작하는가 · 무엇이 더 필요한가 · 주소를 어떻게 고치는가</text><text x="380.0" y="348" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">매직이 없는 형식(.COM)은 이 질문들의 답을 「약속」으로 대신한다 --- 그래서 하나도 못 바꾼다</text><text x="380.0" y="366" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">매직이 있는 형식은 답을 파일 안에 적는다 --- 그래서 형식이 자란다</text></svg>