<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="760" height="430" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="380.0" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">표준이 가른 타입의 갈래 (§6.2.5)</text><rect x="320" y="36" width="120" height="30" fill="none" stroke="#111" stroke-width="1.6"/><text x="380" y="56" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">타입</text><rect x="150" y="92" width="160" height="30" fill="none" stroke="#111" stroke-width="1.6"/><text x="230" y="112" font-size="12" font-weight="normal" text-anchor="middle" fill="#111">객체 타입</text><rect x="470" y="92" width="160" height="30" fill="none" stroke="#111" stroke-width="1.6"/><text x="550" y="112" font-size="12" font-weight="normal" text-anchor="middle" fill="#111">함수 타입</text><line x1="370" y1="66" x2="250" y2="90" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="390" y1="66" x2="530" y2="90" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="60" y="152" width="175" height="28" fill="none" stroke="#111" stroke-width="1.6"/><text x="147" y="171" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">산술 타입</text><rect x="255" y="152" width="260" height="28" fill="none" stroke="#111" stroke-width="1.6"/><text x="385" y="171" font-size="12" font-weight="normal" text-anchor="middle" fill="#111">포인터·배열·구조체·공용체·void</text><line x1="210" y1="122" x2="160" y2="150" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="250" y1="122" x2="340" y2="150" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="30" y="208" width="120" height="26" fill="none" stroke="#111" stroke-width="1.6"/><text x="90" y="226" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">정수 타입</text><rect x="160" y="208" width="120" height="26" fill="none" stroke="#111" stroke-width="1.6"/><text x="220" y="226" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">부동소수점 타입</text><line x1="130" y1="180" x2="95" y2="206" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="165" y1="180" x2="215" y2="206" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="20" y="258" width="150" height="24" fill="none" stroke="#111" stroke-width="1.6"/><text x="95" y="275" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">char / signed char / unsigned char</text><rect x="20" y="288" width="150" height="24" fill="none" stroke="#111" stroke-width="1.6"/><text x="95" y="305" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">부호 있는 정수 타입 (short·int·long…)</text><rect x="20" y="318" width="150" height="24" fill="none" stroke="#111" stroke-width="1.6"/><text x="95" y="335" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">부호 없는 정수 타입 (bool 포함)</text><rect x="20" y="348" width="150" height="24" fill="none" stroke="#111" stroke-width="1.6"/><text x="95" y="365" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">열거 타입</text><line x1="90" y1="234" x2="90" y2="256" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="300" y="208" width="215" height="26" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="407" y="226" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">실수 타입 = 정수 + 실수 부동소수점</text><rect x="300" y="248" width="215" height="26" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="407" y="266" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">스칼라 = 산술 + 포인터 + nullptr_t</text><rect x="300" y="288" width="215" height="26" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="407" y="306" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">집합체 = 배열 + 구조체 (공용체 제외)</text><rect x="300" y="328" width="215" height="26" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="407" y="346" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">기본 타입 = char + 정수 + 부동소수점</text><rect x="545" y="152" width="195" height="28" fill="none" stroke="#111" stroke-width="1.6"/><text x="642" y="171" font-size="12" font-weight="normal" text-anchor="middle" fill="#111">파생 타입</text><line x1="560" y1="122" x2="620" y2="150" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="555" y="196" width="175" height="24" fill="none" stroke="#111" stroke-width="1.6"/><text x="642" y="213" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">배열 · 구조체 · 공용체</text><rect x="555" y="226" width="175" height="24" fill="none" stroke="#111" stroke-width="1.6"/><text x="642" y="243" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">함수 · 포인터</text><rect x="555" y="256" width="175" height="24" fill="none" stroke="#111" stroke-width="1.6"/><text x="642" y="273" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">원자적(_Atomic)</text><line x1="642" y1="180" x2="642" y2="194" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text x="380.0" y="416" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">점선 상자는 '겹쳐 부르는 이름'이다 — 나무의 가지가 아니라 여러 가지를 묶은 낱말.</text></svg>