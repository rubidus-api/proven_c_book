<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="780" height="400" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="390.0" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">측정의 세 함정 --- 잰 수가 이상하면 먼저 여기를 본다</text><rect x="30" y="44" width="230" height="330" fill="none" stroke="#111" stroke-width="1.6"/><text x="145" y="68" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">① 지워짐</text><rect x="55" y="86" width="180" height="34" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="145" y="108" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">내가 쓴 코드</text><rect x="55" y="132" width="180" height="34" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="145" y="154" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">컴파일러</text><rect x="55" y="178" width="180" height="34" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="145" y="200" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">실행된 코드</text><text x="145" y="232" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">✗ 지워짐</text><text x="145" y="258" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">결과를 아무도 안 쓰면</text><text x="145" y="274" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">계산이 통째로 사라진다</text><text x="145" y="306" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">→ 결과를 volatile 에 넣거나</text><text x="145" y="322" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">   반환값을 쓴다</text><rect x="275" y="44" width="230" height="330" fill="none" stroke="#111" stroke-width="1.6"/><text x="390" y="68" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">② 데우기</text><rect x="300" y="86" width="180" height="34" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="390" y="108" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">첫 회</text><rect x="300" y="132" width="180" height="34" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="390" y="154" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">둘째 회</text><rect x="300" y="178" width="180" height="34" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="390" y="200" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">셋째 회…</text><text x="390" y="258" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">첫 회에는 쪽 부재·캐시 채우기</text><text x="390" y="274" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">값이 섞인다 (이 기계에서 9배)</text><text x="390" y="306" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">→ 데우기 회차를 돌리고</text><text x="390" y="322" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">   그 회차는 버린다</text><rect x="520" y="44" width="230" height="330" fill="none" stroke="#111" stroke-width="1.6"/><text x="635" y="68" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">③ 잡음</text><rect x="545" y="86" width="180" height="34" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="635" y="108" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">회차들</text><rect x="545" y="132" width="180" height="34" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="635" y="154" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">평균</text><rect x="545" y="178" width="180" height="34" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="635" y="200" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">중앙값</text><text x="635" y="258" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">남의 일이 한 번 끼어들면</text><text x="635" y="274" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">평균이 그쪽으로 끌려간다</text><text x="635" y="306" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">→ 중앙값을 쓰고</text><text x="635" y="322" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">   최솟값을 함께 적는다</text></svg>