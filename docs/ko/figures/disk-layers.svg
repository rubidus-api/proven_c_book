<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="780" height="420" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="390.0" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">디스크 한 장의 배치 --- 세 층이 겹쳐 있다</text><text x="40" y="58" font-size="11" font-weight="bold" text-anchor="start" fill="#111">① 기계가 보는 것: 번호 붙은 칸(섹터)의 줄</text><rect x="40" y="68" width="80" height="34" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="80.0" y="89" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">LBA 0</text><rect x="120" y="68" width="80" height="34" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="160.0" y="89" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">1</text><rect x="200" y="68" width="150" height="34" fill="none" stroke="#111" stroke-width="1.6"/><text x="275.0" y="89" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">2 ~ 33</text><rect x="350" y="68" width="150" height="34" fill="none" stroke="#111" stroke-width="1.6"/><text x="425.0" y="89" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">34 …</text><rect x="500" y="68" width="80" height="34" fill="none" stroke="#111" stroke-width="1.6"/><text x="540.0" y="89" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">…</text><rect x="580" y="68" width="150" height="34" fill="none" stroke="#111" stroke-width="1.6"/><text x="655.0" y="89" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">끝-33 …</text><rect x="730" y="68" width="80" height="34" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="770.0" y="89" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">끝</text><text x="40" y="140" font-size="11" font-weight="bold" text-anchor="start" fill="#111">② 파티션 표가 말하는 것: 어디부터 어디까지가 한 덩어리인가</text><rect x="40" y="150" width="80" height="40" fill="#e8e8e8" stroke="#111" stroke-width="1.6"/><text x="80.0" y="168" font-size="9" font-weight="bold" text-anchor="middle" fill="#111">MBR</text><text x="80.0" y="182" font-size="8" font-weight="normal" text-anchor="middle" fill="#111">또는 보호 MBR</text><rect x="120" y="150" width="80" height="40" fill="#e8e8e8" stroke="#111" stroke-width="1.6"/><text x="160.0" y="168" font-size="9" font-weight="bold" text-anchor="middle" fill="#111">GPT 헤더</text><text x="160.0" y="182" font-size="8" font-weight="normal" text-anchor="middle" fill="#111">LBA 1</text><rect x="200" y="150" width="90" height="40" fill="#e8e8e8" stroke="#111" stroke-width="1.6"/><text x="245.0" y="168" font-size="9" font-weight="bold" text-anchor="middle" fill="#111">항목 배열</text><text x="245.0" y="182" font-size="8" font-weight="normal" text-anchor="middle" fill="#111">128×128B</text><rect x="290" y="150" width="130" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="355.0" y="174" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">파티션 1 (ESP)</text><rect x="420" y="150" width="180" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="510.0" y="174" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">파티션 2 (root)</text><rect x="600" y="150" width="90" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="645.0" y="174" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">파티션 3</text><rect x="690" y="150" width="90" height="40" fill="#e8e8e8" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="735" y="168" font-size="9" font-weight="bold" text-anchor="middle" fill="#111">짝 GPT</text><text x="735" y="182" font-size="8" font-weight="normal" text-anchor="middle" fill="#111">디스크 끝</text><text x="40" y="232" font-size="11" font-weight="bold" text-anchor="start" fill="#111">③ 파티션 *안*: 파일 시스템이 다시 제 방식으로 나눈다</text><line x1="480" y1="195" x2="300" y2="240" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="250" width="110" height="46" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="95.0" y="270" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">부트 섹터</text><text x="95.0" y="286" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">BPB·서명</text><rect x="150" y="250" width="130" height="46" fill="none" stroke="#111" stroke-width="1.6"/><text x="215.0" y="270" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">FAT 1벌</text><text x="215.0" y="286" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">다음 클러스터 표</text><rect x="280" y="250" width="130" height="46" fill="none" stroke="#111" stroke-width="1.6"/><text x="345.0" y="270" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">FAT 2벌</text><text x="345.0" y="286" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">사본</text><rect x="410" y="250" width="370" height="46" fill="none" stroke="#111" stroke-width="1.6"/><text x="595.0" y="270" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">자료 구역</text><text x="595.0" y="286" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">클러스터 2, 3, 4 …</text><rect x="40" y="320" width="740" height="78" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="390.0" y="344" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">세 층은 서로를 모른다</text><text x="390.0" y="364" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">기계는 섹터만 알고 · 파티션 표는 범위만 알고 · 파일 시스템은 제 파티션 안만 안다</text><text x="390.0" y="384" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">그래서 파티션 표가 날아가도 자료는 그 자리에 있고, 포맷을 해도 다른 파티션은 멀쩡하다</text></svg>