<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="760" height="340" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="380.0" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">같은 자료를 옮기는 두 가지 길</text><text x="40" y="54" font-size="12" font-weight="bold" text-anchor="start" fill="#111">① CPU 가 직접 --- 바이트마다 CPU 를 거친다</text><rect x="60" y="66" width="120" height="54" fill="none" stroke="#111" stroke-width="1.6"/><text x="120" y="98" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">장치</text><rect x="320" y="66" width="120" height="54" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="380" y="92" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">CPU</text><text x="380" y="110" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">레지스터를 거쳐</text><rect x="580" y="66" width="120" height="54" fill="none" stroke="#111" stroke-width="1.6"/><text x="640" y="98" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">기억</text><line x1="180" y1="93" x2="318" y2="93" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="440" y1="93" x2="578" y2="93" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text x="380.0" y="136" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">바이트마다 끼어들기 → CPU 는 그동안 다른 일을 못 한다</text><text x="40" y="176" font-size="12" font-weight="bold" text-anchor="start" fill="#111">② DMA --- 장치와 기억이 곧장, CPU 는 시작과 끝만</text><rect x="60" y="188" width="120" height="54" fill="none" stroke="#111" stroke-width="1.6"/><text x="120" y="220" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">장치</text><rect x="580" y="188" width="120" height="54" fill="none" stroke="#111" stroke-width="1.6"/><text x="640" y="220" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">기억</text><rect x="320" y="188" width="120" height="54" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="380" y="214" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">DMA 제어기</text><text x="380" y="232" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">덩어리를 나른다</text><line x1="180" y1="215" x2="318" y2="215" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="440" y1="215" x2="578" y2="215" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="320" y="262" width="120" height="40" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="380" y="287" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">CPU</text><line x1="380" y1="262" x2="380" y2="244" stroke="#111" stroke-width="1.2" stroke-dasharray="3 3"/><text x="210" y="287" font-size="10" font-weight="normal" text-anchor="end" fill="#111">시작 시킴</text><text x="550" y="287" font-size="10" font-weight="normal" text-anchor="start" fill="#111">끝나면 끼어들기 한 번</text><rect x="40" y="312" width="680" height="24" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="380.0" y="328" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">옮기는 일 자체는 같다 --- 달라지는 것은 그동안 CPU 가 자유로운가다</text></svg>