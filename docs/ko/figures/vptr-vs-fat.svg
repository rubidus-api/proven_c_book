<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="800" height="360" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="400.0" y="24" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">표 포인터의 두 자리</text><text x="20" y="62" font-size="12" font-weight="bold" text-anchor="start" fill="#111">객체 안 (vptr)</text><rect x="40" y="84" width="60" height="36" fill="none" stroke="#111" stroke-width="1.0"/><text x="70" y="107" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">포인터</text><line x1="100" y1="102" x2="198" y2="102" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="200" y="84" width="70" height="36" fill="none" stroke="#111" stroke-width="1.6"/><text x="235" y="107" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">표 포인터</text><rect x="270" y="84" width="150" height="36" fill="url(#hatch)" stroke="#111" stroke-width="1.0"/><text x="345" y="107" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">상태</text><line x1="235" y1="120" x2="520" y2="120" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="522" y="88" width="130" height="64" fill="none" stroke="#111" stroke-width="2.2"/><text x="587" y="82" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">표 --- 종류마다 한 벌</text><line x1="522" y1="120" x2="652" y2="120" stroke="#111" stroke-width="1"/><text x="587" y="110" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">area</text><text x="587" y="142" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">print</text><text x="310" y="150" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">객체가 표 포인터만큼 크다 --- 포인터는 하나</text><text x="20" y="200" font-size="12" font-weight="bold" text-anchor="start" fill="#111">포인터 옆 (뚱뚱한 포인터)</text><rect x="40" y="222" width="60" height="36" fill="none" stroke="#111" stroke-width="1.6"/><text x="70" y="245" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">자료</text><rect x="100" y="222" width="60" height="36" fill="none" stroke="#111" stroke-width="1.6"/><text x="130" y="245" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">표</text><line x1="70" y1="258" x2="238" y2="292" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="240" y="276" width="180" height="36" fill="url(#hatch)" stroke="#111" stroke-width="1.0"/><text x="330" y="299" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">상태 (고칠 수 없어도 된다)</text><line x1="160" y1="240" x2="520" y2="240" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="522" y="226" width="130" height="64" fill="none" stroke="#111" stroke-width="2.2"/><text x="587" y="220" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">표 --- 종류마다 한 벌</text><line x1="522" y1="258" x2="652" y2="258" stroke="#111" stroke-width="1"/><text x="587" y="248" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">area</text><text x="587" y="280" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">print</text><text x="400" y="338" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">객체는 그대로 --- 그것을 가리키는 포인터가 둘이 된다</text></svg>