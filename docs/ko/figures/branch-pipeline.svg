<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="780" height="380" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="390.0" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">맞혔을 때와 틀렸을 때 --- 파이프라인에서 벌어지는 일</text><text x="40" y="50" font-size="12" font-weight="bold" text-anchor="start" fill="#111">① 예측이 맞았을 때 --- 빈칸 없이 이어진다</text><rect x="150" y="60" width="92" height="18" fill="#ececec" stroke="#111" stroke-width="1.0"/><text x="196" y="73" font-size="8" font-weight="normal" text-anchor="middle" fill="#111">가져오기 1</text><rect x="150" y="82" width="92" height="18" fill="#ececec" stroke="#111" stroke-width="1.0"/><text x="196" y="95" font-size="8" font-weight="normal" text-anchor="middle" fill="#111">해독 1</text><rect x="150" y="104" width="92" height="18" fill="#ececec" stroke="#111" stroke-width="1.0"/><text x="196" y="117" font-size="8" font-weight="normal" text-anchor="middle" fill="#111">실행 1</text><rect x="150" y="126" width="92" height="18" fill="#ececec" stroke="#111" stroke-width="1.0"/><text x="196" y="139" font-size="8" font-weight="normal" text-anchor="middle" fill="#111">쓰기 1</text><rect x="250" y="60" width="92" height="18" fill="#ececec" stroke="#111" stroke-width="1.0"/><text x="296" y="73" font-size="8" font-weight="normal" text-anchor="middle" fill="#111">가져오기 2</text><rect x="250" y="82" width="92" height="18" fill="#ececec" stroke="#111" stroke-width="1.0"/><text x="296" y="95" font-size="8" font-weight="normal" text-anchor="middle" fill="#111">해독 2</text><rect x="250" y="104" width="92"