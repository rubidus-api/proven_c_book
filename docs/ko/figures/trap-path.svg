<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="760" height="250" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="380.0" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">0 으로 나누면 무슨 일이 일어나는가 --- 네 걸음</text><rect x="40" y="70" width="150" height="60" fill="none" stroke="#111" stroke-width="1.6"/><text x="115" y="92" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">① 내 C 코드</text><text x="115" y="112" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">x / zero</text><rect x="220" y="70" width="150" height="60" fill="none" stroke="#111" stroke-width="1.6"/><text x="295" y="92" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">② CPU</text><text x="295" y="112" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">예외를 일으킨다</text><rect x="400" y="70" width="150" height="60" fill="none" stroke="#111" stroke-width="1.6"/><text x="475" y="92" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">③ 커널</text><text x="475" y="112" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">트랩 처리기가 받는다</text><rect x="580" y="70" width="150" height="60" fill="none" stroke="#111" stroke-width="1.6"/><text x="655" y="92" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">④ 내 C 함수</text><text x="655" y="112" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">신호 처리기</text><line x1="190" y1="100" x2="218" y2="100" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="370" y1="100" x2="398" y2="100" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="550" y1="100" x2="578" y2="100" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text x="380.0" y="160" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">돌아가면? --- 같은 명령을 다시 실행하려 든다. 그래서 무한히 다시 터진다.</text><text x="380.0" y="182" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">표준도 그렇게 적어 두었다: 트랩 처리기에서 그냥 반환하면 미정의 동작이다.</text><line x1="655" y1="138" x2="655" y2="200" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text x="655" y="218" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">siglongjmp 으로 빠져나온다</text></svg>