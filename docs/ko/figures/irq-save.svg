<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="760" height="300" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="380.0" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">인터럽트가 걸릴 때 하드웨어가 저장해 주는 양</text><text x="140" y="52" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Arm Cortex-M</text><rect x="60" y="64" width="160" height="150" fill="#f7f7f7" stroke="#111" stroke-width="1.6"/><rect x="80" y="78" width="120" height="22" fill="#dbe7f3" stroke="#111" stroke-width="1.6"/><text x="140" y="93" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">R0–R3</text><rect x="80" y="104" width="120" height="22" fill="#dbe7f3" stroke="#111" stroke-width="1.6"/><text x="140" y="119" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">R12</text><rect x="80" y="130" width="120" height="22" fill="#dbe7f3" stroke="#111" stroke-width="1.6"/><text x="140" y="145" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">LR</text><rect x="80" y="156" width="120" height="22" fill="#dbe7f3" stroke="#111" stroke-width="1.6"/><text x="140" y="171" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">PC</text><rect x="80" y="182" width="120" height="22" fill="#dbe7f3" stroke="#111" stroke-width="1.6"/><text x="140" y="197" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">xPSR</text><text x="140" y="232" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">하드웨어가 8 개</text><text x="140" y="252" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#111">보통 C 함수로 충분</text><text x="380" y="52" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">AVR</text><rect x="300" y="64" width="160" height="150" fill="#f7f7f7" stroke="#111" stroke-width="1.6"/><rect x="320" y="78" width="120" height="22" fill="#dbe7f3" stroke="#111" stroke-width="1.6"/><text x="380" y="93" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">PC (2바이트)</text><text x="380" y="232" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">하드웨어가 1 개</text><text x="380" y="252" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#111">SREG 저장·reti 를 컴파일러가</text><text x="620" y="52" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">RISC-V</text><rect x="540" y="64" width="160" height="150" fill="#fdeaea" stroke="#111" stroke-width="1.6"/><text x="620" y="140" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">아무것도</text><text x="620" y="160" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">저장하지 않는다</text><text x="620" y="232" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">하드웨어가 0 개</text><text x="620" y="252" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#111">쓰는 레지스터 전부를 컴파일러가</text><text x="380.0" y="286" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">하드웨어가 해 주는 양이 곧 컴파일러가 해야 할 일의 양이다</text></svg>