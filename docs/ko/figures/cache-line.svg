middle" fill="#111">걸음 폭 (바이트, 두 배씩)</text><line x1="400.0" y1="66" x2="400.0" y2="300" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/><text x="400.0" y="60" font-size="9" font-weight="bold" text-anchor="middle" fill="#111">캐시 줄 64바이트</text><polyline points="90.0,288.7043189368771 141.66666666666666,288.60209557883974 193.33333333333331,287.298747763864 245.0,284.487605417838 296.66666666666663,274.6997188857654 348.33333333333337,251.49501661129568 400.0,212.7268080756453 451.6666666666667,168.97521083567594 503.3333333333333,139.02376693074365 555.0,114.43904932277022 606.6666666666667,113.28903654485046 658.3333333333333,99.99999999999997 710.0,130.51367237413746" fill="none" stroke="#111" stroke-width="2.2"/><circle cx="90.0" cy="288.7043189368771" r="3" fill="#111"/><text x="90.0" y="318" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">1</text><circle cx="141.66666666666666" cy="288.60209557883974" r="3" fill="#111"/><circle cx="193.33333333333331" cy="287.298747763864" r="3" fill="#111"/><circle cx="245.0" cy="284.487605417838" r="3" fill="#111"/><text x="245.0" y="318" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">8</text><circle cx="296.66666666666663" cy="274.6997188857654" r="3" fill="#111"/><circle cx="348.33333333333337" cy="251.49501661129568" r="3" fill="#111"/><circle cx="400.0" cy="212.7268080756453" r="3" fill="#111"/><text x="400.0" y="318" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">64</text><circle cx="451.6666666666667" cy="168.97521083567594" r="3" fill="#111"/><circle cx="503.3333333333333" cy="139.02376693074365" r="3" fill="#111"/><circle cx="555.0" cy="114.43904932277022" r="3" fill="#111"/><text x="555.0" y="318" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">512</text><circle cx="606.6666666666667" cy="113.28903654485046" r="3" fill="#111"/><circle cx="658.3333333333333" cy="99.99999999999997" r="3" fill="#111"/><circle cx="710.0" cy="130.51367237413746" r="3" fill="#111"/><text x="710.0" y="318" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">4096</text><text x="110" y="90" font-size="10" font-weight="normal" text-anchor="start" fill="#111">왼쪽: 한 줄을 여러 번 나눠 쓴다 --- 값이 낮다</text><text x="414.0" y="112" font-size="10" font-weight="normal" text-anchor="start" fill="#111">오른쪽: 걸음마다 새 줄 --- 값이 올라 평평해진다</text><rect x="90" y="322" width="620" height="62" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="390.0" y="344" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">줄이 64바이트라는 사실이 시간에 그대로 나타난다</text><text x="390.0" y="362" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">8바이트만 쓰려 해도 기계는 64바이트를 실어 온다</text><text x="390.0" y="378" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">→ 그래서 「무엇을 읽는가」만큼 「어떻게 늘어놓는가」가 값을 정한다</text></svg>