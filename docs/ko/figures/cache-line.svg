<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="780" height="400" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="390.0" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">걸음 폭이 캐시 줄을 넘어서는 자리</text><line x1="90" y1="300" x2="710" y2="300" stroke="#111" stroke-width="1.4"/><line x1="90" y1="70" x2="90" y2="300" stroke="#111" stroke-width="1.4"/><line x1="86" y1="300.0" x2="90" y2="300.0" stroke="#111" stroke-width="1"/><text x="82" y="304.0" font-size="9" font-weight="normal" text-anchor="end" fill="#111">0</text><line x1="86" y1="246.928486135067" x2="90" y2="246.928486135067" stroke="#111" stroke-width="1"/><text x="82" y="250.928486135067" font-size="9" font-weight="normal" text-anchor="end" fill="#111">2</text><line x1="86" y1="193.856972270134" x2="90" y2="193.856972270134" stroke="#111" stroke-width="1"/><text x="82" y="197.856972270134" font-size="9" font-weight="normal" text-anchor="end" fill="#111">4</text><line x1="86" y1="140.78545840520098" x2="90" y2="140.78545840520098" stroke="#111" stroke-width="1"/><text x="82" y="144.78545840520098" font-size="9" font-weight="normal" text-anchor="end" fill="#111">6</text><line x1="86" y1="87.71394454026799" x2="90" y2="87.71394454026799" stroke="#111" stroke-width="1"/><text x="82" y="91.71394454026799" font-size="9" font-weight="normal" text-anchor="end" fill="#111">8</text><text x="34" y="185.0" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">나노초</text><text x="400.0" y="336" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">걸음 폭 (바이트, 두 배씩)</text><line x1="400.0" y1="66" x2="400.0" y2="300" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/><text x="400.0" y="60" font-size="9" font-weight="bold" text-anchor="middle" fill="#111">캐시 줄 64바이트</text><polyline points="90.0,283.09672283401886 141.66666666666666,282.99057980628896 193.33333333333331,282.3271858829773 245.0,279.7001459466631 296.66666666666663,273.1988854982088 348.33333333333337,256.40175135995753 400.0,217.0492238291097 451.6666666666667,172.68143823802575 503.3333333333333,144.1820352925567 555.0,118.8934589359161 606.6666666666667,111.038874883906 658.3333333333333,99.99999999999997 710.0,124.25368183627435" fill="none" stroke="#111" stroke-width="2.2"/><circle cx="90.0" cy="283.09672283401886" r="3" fill="#111"/><text x="90.0" y="318" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">1</text><circle cx="141.66666666666666" cy="282.99057980628896" r="3" fill="#111"/><circle cx="193.33333333333331" cy="282.3271858829773" r="3" fill="#111"/><circle cx="245.0" cy="279.7001459466631" r="3" fill="#111"/><text x="245.0" y="318" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">8</text><circle cx="296.66666666666663" cy="273.1988854982088" r="3" fill="#111"/><circle cx="348.33333333333337" cy="256.40175135995753" r="3" fill="#111"/><circle cx="400.0" cy="217.0492238291097" r="3" fill="#111"/><text x="400.0" y="318" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">64</text><circle cx="451.6666666666667" cy="172.68143823802575" r="3" fill="#111"/><circle cx="503.3333333333333" cy="144.1820352925567" r="3" fill="#111"/><circle cx="555.0" cy="118.8934589359161" r="3" fill="#111"/><text x="555.0" y="318" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">512</text><circle cx="606.6666666666667" cy="111.038874883906" r="3" fill="#111"/><circle cx="658.3333333333333" cy="99.99999999999997" r="3" fill="#111"/><circle cx="710.0" cy="124.25368183627435" r="3" fill="#111"/><text x="710.0" y="318" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">4096</text><text x="110" y="90" font-size="10" font-weight="normal" text-anchor="start" fill="#111">왼쪽: 한 줄을 여러 번 나눠 쓴다 --- 값이 낮다</text><text x="414.0" y="112" font-size="10" font-weight="normal" text-anchor="start" fill="#111">오른쪽: 걸음마다 새 줄 --- 값이 올라 평평해진다</text><rect x="90" y="322" width="620" height="62" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="390.0" y="344" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">줄이 64바이트라는 사실이 시간에 그대로 나타난다</text><text x="390.0" y="362" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">8바이트만 쓰려 해도 기계는 64바이트를 실어 온다</text><text x="390.0" y="378" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">→ 그래서 「무엇을 읽는가」만큼 「어떻게 늘어놓는가」가 값을 정한다</text></svg>