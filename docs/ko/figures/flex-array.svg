<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 306" width="760" height="306" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="760" height="306" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="380.0" y="24" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">유연 배열 멤버 --- 머리와 데이터를 한 덩어리로</text><text x="60" y="60" font-size="12" font-weight="bold" text-anchor="start" fill="#111">① 포인터 멤버 (할당 둘)</text><rect x="60" y="74" width="90" height="42" fill="none" stroke="#111" stroke-width="1.6"/><text x="105" y="100" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">len</text><rect x="150" y="74" width="120" height="42" fill="none" stroke="#111" stroke-width="1.6"/><text x="210" y="100" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">char *data</text><rect x="390" y="74" width="300" height="42" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="5 4"/><text x="540" y="100" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">따로 잡은 버퍼</text><line x1="270" y1="95" x2="384" y2="95" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text x="60" y="136" font-size="10.5" font-weight="normal" text-anchor="start" fill="#111">malloc 두 번, free 두 번. 머리와 데이터가 멀리 떨어진다</text><text x="60" y="168" font-size="12" font-weight="bold" text-anchor="start" fill="#111">② 유연 배열 멤버 char data[] (할당 하나)</text><rect x="60" y="182" width="90" height="42" fill="none" stroke="#111" stroke-width="1.6"/><text x="105" y="208" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">len</text><rect x="150" y="182" width="420" height="42" fill="none" stroke="#111" stroke-width="1.6"/><text x="360" y="208" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">data[] --- 잡을 때 길이를 정한다</text><line x1="60" y1="236" x2="570" y2="236" stroke="#111" stroke-width="1.4"/><text x="315" y="252" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">malloc(offsetof(struct msg, data) + len) 한 번</text><text x="60" y="274" font-size="10.5" font-weight="normal" text-anchor="start" fill="#111">sizeof 에 data 는 들어가지 않는다. 마지막 멤버여야 하고, 앞에 멤버가 하나 이상 있어야 한다</text><text x="380.0" y="292" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#111">한 덩어리라 캐시에 함께 들어오고, free 도 한 번이다</text></svg>