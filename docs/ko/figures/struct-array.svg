<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 306" width="760" height="306" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="760" height="306" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="380.0" y="24" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">구조체의 배열 --- 원소 사이에는 빈자리가 없다</text><text x="380.0" y="46" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#111">struct rec { int id; char code; };   sizeof = 8, _Alignof = 4</text><text x="60" y="70" font-size="12" font-weight="bold" text-anchor="start" fill="#111">원소 하나의 속</text><rect x="60" y="84" width="160" height="44" fill="none" stroke="#111" stroke-width="1.6"/><text x="140.0" y="112" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">id (4)</text><rect x="220" y="84" width="40" height="44" fill="none" stroke="#111" stroke-width="1.6"/><text x="240.0" y="112" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">code</text><rect x="260" y="84" width="120" height="44" fill="url(#hatch)" stroke="#111" stroke-width="1.6"/><text x="320.0" y="112" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">꼬리 패딩 (3)</text><text x="392" y="112" font-size="11" font-weight="bold" text-anchor="start" fill="#111">sizeof = 8</text><text x="60" y="162" font-size="12" font-weight="bold" text-anchor="start" fill="#111">struct rec v[3]</text><rect x="60" y="176" width="104" height="40" fill="none" stroke="#111" stroke-width="1.6"/><rect x="164" y="176" width="26" height="40" fill="none" stroke="#111" stroke-width="1.6"/><rect x="190" y="176" width="78" height="40" fill="url(#hatch)" stroke="#111" stroke-width="1.6"/><text x="164" y="168" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">[0]</text><text x="60" y="234" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">+0</text><rect x="268" y="176" width="104" height="40" fill="none" stroke="#111" stroke-width="1.6"/><rect x="372" y="176" width="26" height="40" fill="none" stroke="#111" stroke-width="1.6"/><rect x="398" y="176" width="78" height="40" fill="url(#hatch)" stroke="#111" stroke-width="1.6"/><text x="372" y="168" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">[1]</text><text x="268" y="234" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">+8</text><rect x="476" y="176" width="104" height="40" fill="none" stroke="#111" stroke-width="1.6"/><rect x="580" y="176" width="26" height="40" fill="none" stroke="#111" stroke-width="1.6"/><rect x="606" y="176" width="78" height="40" fill="url(#hatch)" stroke="#111" stroke-width="1.6"/><text x="580" y="168" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">[2]</text><text x="476" y="234" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">+16</text><text x="698" y="201" font-size="11" font-weight="bold" text-anchor="start" fill="#111">간격 = sizeof</text><text x="380.0" y="266" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#111">원소가 딱 붙어 놓이므로, 크기가 정렬의 배수여야 둘째 원소부터도 정렬이 맞는다</text><text x="380.0" y="288" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#111">그래서 꼬리 패딩이 생긴다 --- 마지막 멤버 뒤의 빈자리는 낭비가 아니라 계약이다</text></svg>