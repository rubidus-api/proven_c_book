<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="760" height="380" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="380.0" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">같은 한 바이트를 보내는 두 가지 방법</text><text x="40" y="56" font-size="12" font-weight="bold" text-anchor="start" fill="#111">직렬 --- 선 하나에 비트를 줄지어</text><rect x="40" y="66" width="90" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="85" y="91" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">보내는 쪽</text><rect x="630" y="66" width="90" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="675" y="91" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">받는 쪽</text><line x1="130" y1="86" x2="630" y2="86" stroke="#111" stroke-width="1.6"/><rect x="150" y="72" width="50" height="28" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="175" y="91" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">1</text><rect x="208" y="72" width="50" height="28" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="233" y="91" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">0</text><rect x="266" y="72" width="50" height="28" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="291" y="91" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">1</text><rect x="324" y="72" width="50" height="28" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="349" y="91" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">1</text><rect x="382" y="72" width="50" height="28" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="407" y="91" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">0</text><rect x="440" y="72" width="50" height="28" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="465" y="91" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">0</text><rect x="498" y="72" width="50" height="28" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="523" y="91" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">1</text><rect x="556" y="72" width="50" height="28" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="581" y="91" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">0</text><text x="380.0" y="122" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">시간 →   비트가 *차례로* 흐른다 · 선이 적다 · 한 클록에 1비트</text><text x="40" y="166" font-size="12" font-weight="bold" text-anchor="start" fill="#111">병렬 --- 선 여덟에 비트를 한꺼번에</text><rect x="40" y="176" width="90" height="130" fill="none" stroke="#111" stroke-width="1.6"/><text x="85" y="245" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">보내는 쪽</text><rect x="630" y="176" width="90" height="130" fill="none" stroke="#111" stroke-width="1.6"/><text x="675" y="245" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">받는 쪽</text><line x1="130" y1="186" x2="630" y2="186" stroke="#111" stroke-width="1.2"/><text x="380" y="183" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">1</text><line x1="130" y1="201" x2="630" y2="201" stroke="#111" stroke-width="1.2"/><text x="380" y="198" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">0</text><line x1="130" y1="216" x2="630" y2="216" stroke="#111" stroke-width="1.2"/><text x="380" y="213" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">1</text><line x1="130" y1="231" x2="630" y2="231" stroke="#111" stroke-width="1.2"/><text x="380" y="228" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">1</text><line x1="130" y1="246" x2="630" y2="246" stroke="#111" stroke-width="1.2"/><text x="380" y="243" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">0</text><line x1="130" y1="261" x2="630" y2="261" stroke="#111" stroke-width="1.2"/><text x="380" y="258" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">0</text><line x1="130" y1="276" x2="630" y2="276" stroke="#111" stroke-width="1.2"/><text x="380" y="273" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">1</text><line x1="130" y1="291" x2="630" y2="291" stroke="#111" stroke-width="1.2"/><text x="380" y="288" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">0</text><text x="380.0" y="322" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">한 클록에 8비트 --- 그런데 여덟 줄이 *똑같은 순간에* 도착해야 한다</text><rect x="40" y="336" width="680" height="36" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="380.0" y="352" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">빨라질수록 병렬이 진다 --- 줄마다 도착 시각이 어긋나는 폭(스큐)이</text><text x="380.0" y="366" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">한 비트의 시간보다 커지는 순간, 여덟 줄을 맞출 수 없게 된다</text></svg>