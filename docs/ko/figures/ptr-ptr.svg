<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 342" width="760" height="342" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="760" height="342" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="380.0" y="24" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">포인터의 포인터 --- 남의 포인터를 고치는 법</text><text x="60" y="70" font-size="12" font-weight="bold" text-anchor="start" fill="#111">부르는 쪽</text><rect x="60" y="86" width="190" height="46" fill="none" stroke="#111" stroke-width="1.6"/><text x="155.0" y="106" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">char *p</text><text x="155.0" y="124" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">처음엔 널</text><text x="60" y="156" font-size="10.5" font-weight="normal" text-anchor="start" fill="#111">p 가 사는 자리: 0x7ffd10</text><line x1="256" y1="109" x2="344" y2="109" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text x="320" y="100" font-size="10.5" font-weight="normal" text-anchor="start" fill="#111">&amp;p 를 넘긴다 (0x7ffd10)</text><text x="350" y="70" font-size="12" font-weight="bold" text-anchor="start" fill="#111">부름받는 쪽 (char **out)</text><rect x="350" y="86" width="200" height="46" fill="none" stroke="#111" stroke-width="1.6"/><text x="450.0" y="106" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">out</text><text x="450.0" y="124" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">0x7ffd10 --- p 가 사는 자리</text><line x1="450.0" y1="132" x2="450.0" y2="194" stroke="#111" stroke-width="1.8"/><line x1="450.0" y1="194" x2="155.0" y2="194" stroke="#111" stroke-width="1.8"/><line x1="155.0" y1="194" x2="155.0" y2="136" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text x="245.0" y="212" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">*out = buf;  ← 남의 변수에 쓴다</text><rect x="350" y="224" width="200" height="38" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="5 4"/><text x="450.0" y="248" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">새로 잡은 자리 0x5f10</text><text x="380.0" y="300" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#111">돌아오면 p 는 0x5f10 --- 부르는 쪽의 변수가 바뀌었다</text><text x="380.0" y="326" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#111">한 겹을 더 두는 이유: 인자는 값 복사라서, 주소를 넘겨야 원본이 바뀐다</text></svg>