<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="760" height="350" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="380.0" y="24" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">the usual arithmetic conversions — the order of matching two operands</text><rect x="90" y="48" width="380" height="46" fill="none" stroke="#111" stroke-width="1.6"/><text x="104" y="68" font-size="12" font-weight="bold" text-anchor="start" fill="#111">1. integer promotion</text><text x="104" y="86" font-size="11" font-weight="normal" text-anchor="start" fill="#444">anything narrower than int becomes int (or unsigned int)</text><line x1="280.0" y1="94" x2="280.0" y2="116" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="90" y="116" width="380" height="46" fill="none" stroke="#111" stroke-width="1.6"/><text x="104" y="136" font-size="12" font-weight="bold" text-anchor="start" fill="#111">2. same signedness?</text><text x="104" y="154" font-size="11" font-weight="normal" text-anchor="start" fill="#444">if so, take the greater rank</text><line x1="280.0" y1="162" x2="280.0" y2="184" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="90" y="184" width="380" height="46" fill="none" stroke="#111" stroke-width="1.6"/><text x="104" y="204" font-size="12" font-weight="bold" text-anchor="start" fill="#111">3. is the unsigned rank greater or equal?</text><text x="104" y="222" font-size="11" font-weight="normal" text-anchor="start" fill="#444">if so, the unsigned type wins</text><line x1="280.0" y1="230" x2="280.0" y2="252" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="90" y="252" width="380" height="46" fill="none" stroke="#111" stroke-width="1.6"/><text x="104" y="272" font-size="12" font-weight="bold" text-anchor="start" fill="#111">4. can the signed type hold every value of the other?</text><text x="104" y="290" font-size="11" font-weight="normal" text-anchor="start" fill="#444">if so, the signed type; otherwise its unsigned counterpart</text><rect x="510" y="48" width="200" height="250" fill="none" stroke="#111" stroke-width="1.2" stroke-dasharray="5 4"/><text x="610" y="72" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">example</text><text x="526" y="100" font-size="11" font-weight="normal" text-anchor="start" fill="#111">int + unsigned</text><text x="526" y="122" font-size="11" font-weight="normal" text-anchor="start" fill="#111">-&gt; stops at step 3</text><text x="526" y="144" font-size="11" font-weight="normal" text-anchor="start" fill="#111">-&gt; unsigned</text><text x="526" y="166" font-size="11" font-weight="normal" text-anchor="start" fill="#111"></text><text x="526" y="188" font-size="11" font-weight="normal" text-anchor="start" fill="#111">this is where -1</text><text x="526" y="210" font-size="11" font-weight="normal" text-anchor="start" fill="#111">becomes a huge number</text><text x="380.0" y="336" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#111">follow the four in order; most accidents happen at step 3.</text></svg>