idth="60" height="44" fill="none" stroke="#111" stroke-width="1.6"/><text x="170" y="239" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">table</text><line x1="200" y1="234" x2="318" y2="162" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text x="120" y="300" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">one per object --- plus a single table pointer</text><text x="400" y="58" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">table</text><rect x="320" y="110" width="160" height="80" fill="none" stroke="#111" stroke-width="2.2"/><text x="400" y="104" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">static const --- one per kind</text><line x1="320" y1="150" x2="480" y2="150" stroke="#111" stroke-width="1"/><text x="400" y="136" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">area</text><text x="400" y="176" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">draw</text><text x="400" y="300" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">can be placed in a read-only region</text><text x="650" y="58" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">behaviour (functions)</text><rect x="580" y="110" width="150" height="34" fill="none" stroke="#111" stroke-width="1.6"/><text x="655" y="132" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">circle_area</text><rect x="580" y="160" width="150" height="34" fill="none" stroke="#111" stroke-width="1.6"/><text x="655" y="182" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">circle_draw</text><line x1="480" y1="130" x2="578" y2="127" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="480" y1="170" x2="578" y2="177" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text x="655" y="300" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">one copy of the code</text></svg>