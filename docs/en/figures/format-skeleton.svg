<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="760" height="400" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="380.0" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">the formats differ; the loader's questions do not</text><text x="140" y="52" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">DOS .COM</text><rect x="40" y="64" width="200" height="44" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="140" y="91" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">(no header)</text><rect x="40" y="116" width="200" height="44" fill="none" stroke="#111" stroke-width="1.6"/><text x="140" y="143" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">code + data</text><text x="140" y="186" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">by convention: load at 0x100</text><text x="140" y="202" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">and start there</text><text x="380" y="52" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">ELF (Linux)</text><rect x="280" y="64" width="200" height="44" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="380" y="91" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">ELF header</text><rect x="280" y="116" width="200" height="44" fill="none" stroke="#111" stroke-width="1.6"/><text x="380" y="143" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">program header table</text><rect x="280" y="168" width="200" height="44" fill="none" stroke="#111" stroke-width="1.6"/><text x="380" y="195" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">sections: .text .data .bss</text><rect x="280" y="220" width="200" height="44" fill="none" stroke="#111" stroke-width="1.6"/><text x="380" y="247" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">symbols, relocation, debug</text><text x="620" y="52" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">PE (Windows)</text><rect x="520" y="64" width="200" height="44" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="620" y="91" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">MZ header + DOS stub</text><rect x="520" y="116" width="200" height="44" fill="none" stroke="#111" stroke-width="1.6"/><text x="620" y="143" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">PE header + section table</text><rect x="520" y="168" width="200" height="44" fill="none" stroke="#111" stroke-width="1.6"/><text x="620" y="195" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">sections: .text .data .rdata</text><rect x="520" y="220" width="200" height="44" fill="none" stroke="#111" stroke-width="1.6"/><text x="620" y="247" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">import table (IAT), relocation</text><rect x="40" y="300" width="680" height="76" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="380.0" y="324" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">what goes where · where does it start · what else is needed · how are addresses fixed</text><text x="380.0" y="348" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">a format without a magic number (.COM) answers by convention --- so nothing can change</text><text x="380.0" y="366" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">a format with one writes the answers into the file --- so the format can grow</text></svg>