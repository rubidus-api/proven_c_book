<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="780" height="380" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="390.0" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">false sharing --- my core waits because of somebody else's variable</text><text x="40" y="52" font-size="12" font-weight="bold" text-anchor="start" fill="#111">1. when the two variables share a line</text><rect x="60" y="64" width="120" height="52" fill="none" stroke="#111" stroke-width="1.6"/><text x="120" y="86" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">core A</text><text x="120" y="104" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">increments x</text><rect x="600" y="64" width="120" height="52" fill="none" stroke="#111" stroke-width="1.6"/><text x="660" y="86" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">core B</text><text x="660" y="104" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">increments y</text><rect x="300" y="64" width="180" height="52" fill="#ececec" stroke="#111" stroke-width="1.6"/><text x="390" y="84" font-size="9" font-weight="bold" text-anchor="middle" fill="#111">one cache line (64 bytes)</text><text x="390" y="102" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">x  y  (side by side in one line)</text><line x1="180" y1="82" x2="298" y2="82" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="600" y1="100" x2="482" y2="100" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text x="390" y="134" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">the line is taken back and forth</text><text x="390" y="152" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">the code never touches the other's variable --- and yet</text><text x="390" y="168" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">measured here: 1.39 times slower than a perfect split</text><text x="40" y="212" font-size="12" font-weight="bold" text-anchor="start" fill="#111">2. when they are 64 bytes apart</text><rect x="60" y="224" width="120" height="52" fill="none" stroke="#111" stroke-width="1.6"/><text x="120" y="246" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">core A</text><text x="120" y="264" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">increments x</text><rect x="600" y="224" width="120" height="52" fill="none" stroke="#111" stroke-width="1.6"/><text x="660" y="246" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">core B</text><text x="660" y="264" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">increments y</text><rect x="250" y="224" width="130" height="52" fill="#ececec" stroke="#111" stroke-width="1.6"/><text x="315" y="244" font-size="9" font-weight="bold" text-anchor="middle" fill="#111">line 1</text><text x="315" y="262" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">x</text><rect x="410" y="224" width="130" height="52" fill="#ececec" stroke="#111" stroke-width="1.6"/><text x="475" y="244" font-size="9" font-weight="bold" text-anchor="middle" fill="#111">line 2</text><text x="475" y="262" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">y</text><line x1="180" y1="250" x2="248" y2="250" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="600" y1="250" x2="542" y2="250" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text x="390" y="294" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">they do not touch each other</text><text x="390" y="312" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">same code, same computation, only the place moved</text><text x="390" y="328" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">measured here: 1.00 times --- the loss is gone</text></svg>