<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="760" height="330" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="380.0" y="24" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">Same leading members, and the last member's type moves the boundary</text><line x1="150" y1="54" x2="150" y2="60" stroke="#666" stroke-width="1"/><text x="150" y="50" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#666">0</text><line x1="190" y1="54" x2="190" y2="60" stroke="#666" stroke-width="1"/><line x1="230" y1="54" x2="230" y2="60" stroke="#666" stroke-width="1"/><text x="230" y="50" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#666">2</text><line x1="270" y1="54" x2="270" y2="60" stroke="#666" stroke-width="1"/><line x1="310" y1="54" x2="310" y2="60" stroke="#666" stroke-width="1"/><text x="310" y="50" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#666">4</text><line x1="350" y1="54" x2="350" y2="60" stroke="#666" stroke-width="1"/><line x1="390" y1="54" x2="390" y2="60" stroke="#666" stroke-width="1"/><text x="390" y="50" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#666">6</text><line x1="430" y1="54" x2="430" y2="60" stroke="#666" stroke-width="1"/><line x1="470" y1="54" x2="470" y2="60" stroke="#666" stroke-width="1"/><text x="470" y="50" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#666">8</text><line x1="510" y1="54" x2="510" y2="60" stroke="#666" stroke-width="1"/><line x1="550" y1="54" x2="550" y2="60" stroke="#666" stroke-width="1"/><text x="550" y="50" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#666">10</text><line x1="590" y1="54" x2="590" y2="60" stroke="#666" stroke-width="1"/><line x1="630" y1="54" x2="630" y2="60" stroke="#666" stroke-width="1"/><text x="630" y="50" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#666">12</text><line x1="670" y1="54" x2="670" y2="60" stroke="#666" stroke-width="1"/><line x1="710" y1="54" x2="710" y2="60" stroke="#666" stroke-width="1"/><text x="710" y="50" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#666">14</text><text x="138" y="102" font-size="12" font-weight="bold" text-anchor="end" fill="#111">struct s1</text><rect x="150" y="78" width="80" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="190.0" y="103" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">a</text><rect x="230" y="78" width="80" height="40" fill="#eee" stroke="#111" stroke-width="1.6"/><text x="270.0" y="103" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">padding</text><rect x="310" y="78" width="160" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="390.0" y="103" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">b</text><rect x="470" y="78" width="80" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="510.0" y="103" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">c</text><rect x="550" y="78" width="80" height="40" fill="#f6e3e3" stroke="#111" stroke-width="1.6"/><text x="590.0" y="103" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">padding</text><rect x="630" y="78" width="80" height="40" fill="#dbe7f3" stroke="#111" stroke-width="1.6"/><text x="670.0" y="103" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">data[] (uint32_t)</text><line x1="630" y1="66" x2="630" y2="124" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="4 3"/><text x="630" y="62" font-size="10" font-weight="bold" text-anchor="middle" fill="#c0392b">offsetof(data) 12</text><line x1="630" y1="124" x2="630" y2="140" stroke="#2c6fbb" stroke-width="1.6"/><text x="636" y="138" font-size="10" font-weight="bold" text-anchor="start" fill="#2c6fbb">sizeof 12</text><text x="150" y="158" font-size="10.5" font-weight="normal" text-anchor="start" fill="#111">data is uint32_t --- aligning it to 4 leaves two bytes empty after c</text><text x="138" y="212" font-size="12" font-weight="bold" text-anchor="end" fill="#111">struct s2</text><rect x="150" y="188" width="80" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="190.0" y="213" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">a</text><rect x="230" y="188" width="80" height="40" fill="#eee" stroke="#111" stroke-width="1.6"/><text x="270.0" y="213" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">padding</text><rect x="310" y="188" width="160" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="390.0" y="213" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">b</text><rect x="470" y="188" width="80" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="510.0" y="213" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">c</text><rect x="550" y="188" width="120" height="40" fill="#dbe7f3" stroke="#111" stroke-width="1.6"/><text x="610.0" y="213" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">data[] (char)</text><line x1="550" y1="176" x2="550" y2="234" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="4 3"/><text x="550" y="172" font-size="10" font-weight="bold" text-anchor="middle" fill="#c0392b">offsetof(data) 10</text><line x1="630" y1="234" x2="630" y2="250" stroke="#2c6fbb" stroke-width="1.6"/><text x="636" y="248" font-size="10" font-weight="bold" text-anchor="start" fill="#2c6fbb">sizeof 12</text><text x="150" y="268" font-size="10.5" font-weight="normal" text-anchor="start" fill="#111">data is char --- alignment 1, so it follows c directly, with no gap</text><text x="380.0" y="318" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#111">both structs have sizeof 12 --- yet data begins in a different place</text></svg>