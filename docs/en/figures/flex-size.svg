<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="760" height="330" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="380.0" y="24" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">one record, two ways to size it --- the elements start at the same place either way</text><line x1="132" y1="52" x2="132" y2="58" stroke="#666" stroke-width="1"/><text x="132" y="48" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#666">0</text><line x1="224" y1="52" x2="224" y2="58" stroke="#666" stroke-width="1"/><text x="224" y="48" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#666">4</text><line x1="316" y1="52" x2="316" y2="58" stroke="#666" stroke-width="1"/><text x="316" y="48" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#666">8</text><line x1="408" y1="52" x2="408" y2="58" stroke="#666" stroke-width="1"/><text x="408" y="48" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#666">12</text><line x1="500" y1="52" x2="500" y2="58" stroke="#666" stroke-width="1"/><text x="500" y="48" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#666">16</text><line x1="546" y1="52" x2="546" y2="58" stroke="#666" stroke-width="1"/><text x="546" y="48" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#666">18</text><line x1="638" y1="52" x2="638" y2="58" stroke="#666" stroke-width="1"/><text x="638" y="48" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#666">22</text><text x="122" y="96" font-size="11" font-weight="bold" text-anchor="end" fill="#111">struct rec</text><rect x="132" y="74" width="184" height="36" fill="none" stroke="#111" stroke-width="1.6"/><text x="224.0" y="97" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">stamp (8)</text><rect x="316" y="74" width="92" height="36" fill="none" stroke="#111" stroke-width="1.6"/><text x="362.0" y="97" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">count (4)</text><rect x="408" y="74" width="92" height="36" fill="#eee" stroke="#111" stroke-width="1.6"/><text x="454.0" y="97" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">tail padding (4)</text><text x="510" y="97" font-size="10.5" font-weight="bold" text-anchor="start" fill="#111">16 B</text><text x="132" y="128" font-size="10.5" font-weight="normal" text-anchor="start" fill="#111">the type itself. sizeof rounds 12 up to 16 for alignment 8</text><text x="122" y="184" font-size="11" font-weight="bold" text-anchor="end" fill="#111">offsetof rule</text><rect x="132" y="162" width="184" height="36" fill="none" stroke="#111" stroke-width="1.6"/><text x="224.0" y="185" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">stamp (8)</text><rect x="316" y="162" width="92" height="36" fill="none" stroke="#111" stroke-width="1.6"/><text x="362.0" y="185" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">count (4)</text><rect x="408" y="162" width="138" height="36" fill="#dbe7f3" stroke="#111" stroke-width="1.6"/><text x="477.0" y="185" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">data[3] --- three 2-byte slots</text><text x="556" y="185" font-size="10.5" font-weight="bold" text-anchor="start" fill="#111">18 B</text><text x="132" y="216" font-size="10.5" font-weight="normal" text-anchor="start" fill="#111">offsetof(data) + 3x2 = 18 --- an exact fit</text><text x="122" y="272" font-size="11" font-weight="bold" text-anchor="end" fill="#111">sizeof rule</text><rect x="132" y="250" width="184" height="36" fill="none" stroke="#111" stroke-width="1.6"/><text x="224.0" y="273" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">stamp (8)</text><rect x="316" y="250" width="92" height="36" fill="none" stroke="#111" stroke-width="1.6"/><text x="362.0" y="273" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">count (4)</text><rect x="408" y="250" width="138" height="36" fill="#dbe7f3" stroke="#111" stroke-width="1.6"/><text x="477.0" y="273" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">data[3] --- three 2-byte slots</text><rect x="546" y="250" width="92" height="36" fill="#f6e3e3" stroke="#111" stroke-width="1.6"/><text x="592.0" y="273" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">4 B unused</text><text x="648" y="273" font-size="10.5" font-weight="bold" text-anchor="start" fill="#111">22 B</text><text x="132" y="304" font-size="10.5" font-weight="normal" text-anchor="start" fill="#111">sizeof + 3x2 = 22 --- the tail padding is counted twice</text><line x1="408" y1="68" x2="408" y2="292" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 4"/><text x="408" y="64" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#c0392b">offsetof(data) = 12</text><text x="380.0" y="318" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#111">only the last 4 bytes differ --- but ask the size backwards and those 4 bytes change the answer</text></svg>