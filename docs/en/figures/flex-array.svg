<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 306" width="760" height="306" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="760" height="306" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="380.0" y="24" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">a flexible array member --- header and data in one block</text><text x="60" y="60" font-size="12" font-weight="bold" text-anchor="start" fill="#111">1. a pointer member (two allocations)</text><rect x="60" y="74" width="90" height="42" fill="none" stroke="#111" stroke-width="1.6"/><text x="105" y="100" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">len</text><rect x="150" y="74" width="120" height="42" fill="none" stroke="#111" stroke-width="1.6"/><text x="210" y="100" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">char *data</text><rect x="390" y="74" width="300" height="42" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="5 4"/><text x="540" y="100" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">a separately allocated buffer</text><line x1="270" y1="95" x2="384" y2="95" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text x="60" y="136" font-size="10.5" font-weight="normal" text-anchor="start" fill="#111">two mallocs, two frees, and the header sits far from the data</text><text x="60" y="168" font-size="12" font-weight="bold" text-anchor="start" fill="#111">2. a flexible array member char data[] (one allocation)</text><rect x="60" y="182" width="90" height="42" fill="none" stroke="#111" stroke-width="1.6"/><text x="105" y="208" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">len</text><rect x="150" y="182" width="420" height="42" fill="none" stroke="#111" stroke-width="1.6"/><text x="360" y="208" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">data[] --- its length is fixed when it is allocated</text><line x1="60" y1="236" x2="570" y2="236" stroke="#111" stroke-width="1.4"/><text x="315" y="252" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">one malloc(offsetof(struct msg, data) + len)</text><text x="60" y="274" font-size="10.5" font-weight="normal" text-anchor="start" fill="#111">data is not counted in sizeof; it must be the last member, with at least one member before it</text><text x="380.0" y="292" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#111">one block: it arrives in the cache together, and there is one free</text></svg>