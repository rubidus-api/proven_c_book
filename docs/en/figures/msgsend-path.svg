<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="800" height="300" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="400.0" y="24" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">how one message finds its function</text><rect x="40" y="70" width="120" height="56" fill="none" stroke="#111" stroke-width="1.6"/><text x="100" y="94" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">[obj area]</text><text x="100" y="113" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">receiver + selector</text><rect x="190" y="70" width="120" height="56" fill="none" stroke="#111" stroke-width="1.6"/><text x="250" y="94" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">isa</text><text x="250" y="113" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">object → class</text><rect x="340" y="70" width="120" height="56" fill="none" stroke="#111" stroke-width="2.4"/><text x="400" y="94" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">class cache</text><text x="400" y="113" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">selector → function</text><rect x="490" y="70" width="120" height="56" fill="none" stroke="#111" stroke-width="1.6"/><text x="550" y="94" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">method list</text><text x="550" y="113" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">scanned</text><rect x="640" y="70" width="120" height="56" fill="none" stroke="#111" stroke-width="1.6"/><text x="700" y="94" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">parent class</text><text x="700" y="113" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">if absent, go up</text><line x1="162" y1="98" x2="188" y2="98" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="312" y1="98" x2="338" y2="98" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="462" y1="98" x2="488" y2="98" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="612" y1="98" x2="638" y2="98" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text x="394" y="62" font-size="9" font-weight="normal" text-anchor="start" fill="#111">on a miss →</text><line x1="400" y1="128" x2="400" y2="186" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="330" y="188" width="140" height="40" fill="none" stroke="#111" stroke-width="2.2"/><text x="400" y="213" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">call the function</text><text x="408" y="160" font-size="9" font-weight="normal" text-anchor="start" fill="#111">hit</text><line x1="550" y1="128" x2="472" y2="200" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text x="560" y="170" font-size="9" font-weight="normal" text-anchor="start" fill="#111">found: cache it</text><line x1="700" y1="128" x2="700" y2="186" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="615" y="188" width="170" height="40" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="700" y="213" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">forwarding / unknown message</text><text x="400.0" y="284" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">most messages end in the cache --- adding a method throws the caches away</text></svg>