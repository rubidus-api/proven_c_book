<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="780" height="400" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="390.0" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">three traps in measuring --- look here first when a number looks wrong</text><rect x="30" y="44" width="230" height="330" fill="none" stroke="#111" stroke-width="1.6"/><text x="145" y="68" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">1. eliminated</text><rect x="55" y="86" width="180" height="34" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="145" y="108" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">the code I wrote</text><rect x="55" y="132" width="180" height="34" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="145" y="154" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">the compiler</text><rect x="55" y="178" width="180" height="34" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="145" y="200" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">the code that ran</text><text x="145" y="232" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">x eliminated</text><text x="145" y="258" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">if nobody uses the result,</text><text x="145" y="274" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">the computation disappears entirely</text><text x="145" y="306" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">-&gt; put the result in a volatile,</text><text x="145" y="322" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">   or use the return value</text><rect x="275" y="44" width="230" height="330" fill="none" stroke="#111" stroke-width="1.6"/><text x="390" y="68" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">2. warming up</text><rect x="300" y="86" width="180" height="34" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="390" y="108" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">first round</text><rect x="300" y="132" width="180" height="34" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="390" y="154" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">second round</text><rect x="300" y="178" width="180" height="34" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="390" y="200" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">third round…</text><text x="390" y="258" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">the first round mixes in page faults</text><text x="390" y="274" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">and cache filling (9x on this machine)</text><text x="390" y="306" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">-&gt; run warm-up rounds</text><text x="390" y="322" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">   and discard them</text><rect x="520" y="44" width="230" height="330" fill="none" stroke="#111" stroke-width="1.6"/><text x="635" y="68" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">3. noise</text><rect x="545" y="86" width="180" height="34" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="635" y="108" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">the rounds</text><rect x="545" y="132" width="180" height="34" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="635" y="154" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">mean</text><rect x="545" y="178" width="180" height="34" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="635" y="200" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">median</text><text x="635" y="258" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">one interruption from other work</text><text x="635" y="274" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">drags the mean towards it</text><text x="635" y="306" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">-&gt; use the median, and</text><text x="635" y="322" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">   state the minimum alongside</text></svg>