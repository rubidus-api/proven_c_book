<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="760" height="300" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="380.0" y="26" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">how a virtual address becomes a physical one</text><text x="115.0" y="48" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111">virtual pages (what the program sees)</text><rect x="40" y="64" width="150" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="115.0" y="89" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#111">virtual page 0</text><rect x="40" y="112" width="150" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="115.0" y="137" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#111">virtual page 1</text><rect x="40" y="160" width="150" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="115.0" y="185" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#111">virtual page 2</text><rect x="40" y="208" width="150" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="115.0" y="233" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#111">virtual page 3</text><text x="645.0" y="48" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111">physical pages (places in DRAM)</text><rect x="570" y="64" width="150" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="645.0" y="89" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#111">physical page 7</text><rect x="570" y="112" width="150" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="645.0" y="137" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#111">physical page 2</text><rect x="570" y="160" width="150" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="645.0" y="185" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#111">physical page 9</text><rect x="570" y="208" width="150" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="645.0" y="233" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#111">physical page 4</text><rect x="266.0625" y="58" width="227.875" height="196" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="5 4"/><text x="380.0" y="148.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">page table</text><text x="380.0" y="170.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#444">which virtual page is which physical page</text><line x1="190" y1="84.0" x2="266.0625" y2="84.0" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="493.9375" y1="132.0" x2="570" y2="132.0" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="190" y1="132.0" x2="266.0625" y2="132.0" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="493.9375" y1="228.0" x2="570" y2="228.0" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="190" y1="180.0" x2="266.0625" y2="180.0" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="493.9375" y1="84.0" x2="570" y2="84.0" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="190" y1="228.0" x2="266.0625" y2="228.0" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="493.9375" y1="180.0" x2="570" y2="180.0" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text x="380.0" y="266" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#444">what was contiguous is scattered --- neighbours in virtual space are not neighbours in physical space.</text><text x="380.0" y="286" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#444">which is why "close in address" does not mean "fast".</text></svg>