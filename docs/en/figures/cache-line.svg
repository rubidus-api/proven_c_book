<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="780" height="400" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="390.0" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">where the stride crosses the cache line</text><line x1="90" y1="300" x2="710" y2="300" stroke="#111" stroke-width="1.4"/><line x1="90" y1="70" x2="90" y2="300" stroke="#111" stroke-width="1.4"/><line x1="86" y1="300.0" x2="90" y2="300.0" stroke="#111" stroke-width="1"/><text x="82" y="304.0" font-size="9" font-weight="normal" text-anchor="end" fill="#111">0</text><line x1="86" y1="248.246862466037" x2="90" y2="248.246862466037" stroke="#111" stroke-width="1"/><text x="82" y="252.246862466037" font-size="9" font-weight="normal" text-anchor="end" fill="#111">2</text><line x1="86" y1="196.493724932074" x2="90" y2="196.493724932074" stroke="#111" stroke-width="1"/><text x="82" y="200.493724932074" font-size="9" font-weight="normal" text-anchor="end" fill="#111">4</text><line x1="86" y1="144.740587398111" x2="90" y2="144.740587398111" stroke="#111" stroke-width="1"/><text x="82" y="148.740587398111" font-size="9" font-weight="normal" text-anchor="end" fill="#111">6</text><line x1="86" y1="92.987449864148" x2="90" y2="92.987449864148" stroke="#111" stroke-width="1"/><text x="82" y="96.987449864148" font-size="9" font-weight="normal" text-anchor="end" fill="#111">8</text><text x="34" y="185.0" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">ns</text><text x="400.0" y="336" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">stride (bytes, doubling)</text><line x1="400.0" y1="66" x2="400.0" y2="300" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/><text x="400.0" y="60" font-size="9" font-weight="bold" text-anchor="middle" fill="#111">cache line, 64 bytes</text><polyline points="90.0,283.0767240263941 141.66666666666666,282.6109457885884 193.33333333333331,281.834648725579 245.0,278.3671885108035 296.66666666666663,268.2753266916807 348.33333333333337,245.27105705783413 400.0,213.0029758054082 451.6666666666667,166.11463319963772 503.3333333333333,132.19045154612496 555.0,119.45917971277007 606.6666666666667,102.63941001423211 658.3333333333333,99.99999999999997 710.0,132.8114891965325" fill="none" stroke="#111" stroke-width="2.2"/><circle cx="90.0" cy="283.0767240263941" r="3" fill="#111"/><text x="90.0" y="318" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">1</text><circle cx="141.66666666666666" cy="282.6109457885884" r="3" fill="#111"/><circle cx="193.33333333333331" cy="281.834648725579" r="3" fill="#111"/><circle cx="245.0" cy="278.3671885108035" r="3" fill="#111"/><text x="245.0" y="318" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">8</text><circle cx="296.66666666666663" cy="268.2753266916807" r="3" fill="#111"/><circle cx="348.33333333333337" cy="245.27105705783413" r="3" fill="#111"/><circle cx="400.0" cy="213.0029758054082" r="3" fill="#111"/><text x="400.0" y="318" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">64</text><circle cx="451.6666666666667" cy="166.11463319963772" r="3" fill="#111"/><circle cx="503.3333333333333" cy="132.19045154612496" r="3" fill="#111"/><circle cx="555.0" cy="119.45917971277007" r="3" fill="#111"/><text x="555.0" y="318" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">512</text><circle cx="606.6666666666667" cy="102.63941001423211" r="3" fill="#111"/><circle cx="658.3333333333333" cy="99.99999999999997" r="3" fill="#111"/><circle cx="710.0" cy="132.8114891965325" r="3" fill="#111"/><text x="710.0" y="318" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">4096</text><text x="110" y="90" font-size="10" font-weight="normal" text-anchor="start" fill="#111">left: one line used several times over --- the cost is low</text><text x="414.0" y="112" font-size="10" font-weight="normal" text-anchor="start" fill="#111">right: a new line every step --- the cost rises, then flattens</text><rect x="90" y="322" width="620" height="62" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="390.0" y="344" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">that a line is 64 bytes shows up directly in the time</text><text x="390.0" y="362" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">ask for 8 bytes and the machine still fetches 64</text><text x="390.0" y="378" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">-&gt; so how things are laid out settles the cost as much as what is read</text></svg>