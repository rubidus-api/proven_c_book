<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="780" height="400" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="390.0" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">where the stride crosses the cache line</text><line x1="90" y1="300" x2="710" y2="300" stroke="#111" stroke-width="1.4"/><line x1="90" y1="70" x2="90" y2="300" stroke="#111" stroke-width="1.4"/><line x1="86" y1="300.0" x2="90" y2="300.0" stroke="#111" stroke-width="1"/><text x="82" y="304.0" font-size="9" font-weight="normal" text-anchor="end" fill="#111">0</text><line x1="86" y1="252.89129666705924" x2="90" y2="252.89129666705924" stroke="#111" stroke-width="1"/><text x="82" y="256.89129666705924" font-size="9" font-weight="normal" text-anchor="end" fill="#111">2</text><line x1="86" y1="205.78259333411847" x2="90" y2="205.78259333411847" stroke="#111" stroke-width="1"/><text x="82" y="209.78259333411847" font-size="9" font-weight="normal" text-anchor="end" fill="#111">4</text><line x1="86" y1="158.6738900011777" x2="90" y2="158.6738900011777" stroke="#111" stroke-width="1"/><text x="82" y="162.6738900011777" font-size="9" font-weight="normal" text-anchor="end" fill="#111">6</text><line x1="86" y1="111.56518666823695" x2="90" y2="111.56518666823695" stroke="#111" stroke-width="1"/><text x="82" y="115.56518666823695" font-size="9" font-weight="normal" text-anchor="end" fill="#111">8</text><text x="34" y="185.0" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">ns</text><text x="400.0" y="336" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">stride (bytes, doubling)</text><line x1="400.0" y1="66" x2="400.0" y2="300" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/><text x="400.0" y="60" font-size="9" font-weight="bold" text-anchor="middle" fill="#111">cache line, 64 bytes</text><polyline points="90.0,284.66611706512776 141.66666666666666,284.1008126251325 193.33333333333331,283.18219291014015 245.0,280.5912142268284 296.66666666666663,274.0666588152161 348.33333333333337,254.1867860087151 400.0,214.4270403957131 451.6666666666667,161.17065127782357 503.3333333333333,121.99976445648332 555.0,120.9162642798257 606.6666666666667,117.05335060652453 658.3333333333333,100.0 710.0,135.5906253680367" fill="none" stroke="#111" stroke-width="2.2"/><circle cx="90.0" cy="284.66611706512776" r="3" fill="#111"/><text x="90.0" y="318" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">1</text><circle cx="141.66666666666666" cy="284.1008126251325" r="3" fill="#111"/><circle cx="193.33333333333331" cy="283.18219291014015" r="3" fill="#111"/><circle cx="245.0" cy="280.5912142268284" r="3" fill="#111"/><text x="245.0" y="318" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">8</text><circle cx="296.66666666666663" cy="274.0666588152161" r="3" fill="#111"/><circle cx="348.33333333333337" cy="254.1867860087151" r="3" fill="#111"/><circle cx="400.0" cy="214.4270403957131" r="3" fill="#111"/><text x="400.0" y="318" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">64</text><circle cx="451.6666666666667" cy="161.17065127782357" r="3" fill="#111"/><circle cx="503.3333333333333" cy="121.99976445648332" r="3" fill="#111"/><circle cx="555.0" cy="120.9162642798257" r="3" fill="#111"/><text x="555.0" y="318" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">512</text><circle cx="606.6666666666667" cy="117.05335060652453" r="3" fill="#111"/><circle cx="658.3333333333333" cy="100.0" r="3" fill="#111"/><circle cx="710.0" cy="135.5906253680367" r="3" fill="#111"/><text x="710.0" y="318" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">4096</text><text x="110" y="90" font-size="10" font-weight="normal" text-anchor="start" fill="#111">left: one line used several times over --- the cost is low</text><text x="414.0" y="112" font-size="10" font-weight="normal" text-anchor="start" fill="#111">right: a new line every step --- the cost rises, then flattens</text><rect x="90" y="322" width="620" height="62" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="390.0" y="344" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">that a line is 64 bytes shows up directly in the time</text><text x="390.0" y="362" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">ask for 8 bytes and the machine still fetches 64</text><text x="390.0" y="378" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">-&gt; so how things are laid out settles the cost as much as what is read</text></svg>