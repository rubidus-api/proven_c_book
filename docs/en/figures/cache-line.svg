t="bold" text-anchor="middle" fill="#111">stride (bytes, doubling)</text><line x1="400.0" y1="66" x2="400.0" y2="300" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/><text x="400.0" y="60" font-size="9" font-weight="bold" text-anchor="middle" fill="#111">cache line, 64 bytes</text><polyline points="90.0,289.27080775840903 141.66666666666666,289.22170390375646 193.33333333333331,288.0677633194206 245.0,285.1706358949178 296.66666666666663,277.4367787871348 348.33333333333337,257.42695801620425 400.0,218.41394549472136 451.6666666666667,176.01276700220967 503.3333333333333,153.22857844340783 555.0,117.6282838202799 606.6666666666667,117.60373189295359 658.3333333333333,99.99999999999997 710.0,102.45519273262954" fill="none" stroke="#111" stroke-width="2.2"/><circle cx="90.0" cy="289.27080775840903" r="3" fill="#111"/><text x="90.0" y="318" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">1</text><circle cx="141.66666666666666" cy="289.22170390375646" r="3" fill="#111"/><circle cx="193.33333333333331" cy="288.0677633194206" r="3" fill="#111"/><circle cx="245.0" cy="285.1706358949178" r="3" fill="#111"/><text x="245.0" y="318" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">8</text><circle cx="296.66666666666663" cy="277.4367787871348" r="3" fill="#111"/><circle cx="348.33333333333337" cy="257.42695801620425" r="3" fill="#111"/><circle cx="400.0" cy="218.41394549472136" r="3" fill="#111"/><text x="400.0" y="318" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">64</text><circle cx="451.6666666666667" cy="176.01276700220967" r="3" fill="#111"/><circle cx="503.3333333333333" cy="153.22857844340783" r="3" fill="#111"/><circle cx="555.0" cy="117.6282838202799" r="3" fill="#111"/><text x="555.0" y="318" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">512</text><circle cx="606.6666666666667" cy="117.60373189295359" r="3" fill="#111"/><circle cx="658.3333333333333" cy="99.99999999999997" r="3" fill="#111"/><circle cx="710.0" cy="102.45519273262954" r="3" fill="#111"/><text x="710.0" y="318" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">4096</text><text x="110" y="90" font-size="10" font-weight="normal" text-anchor="start" fill="#111">left: one line used several times over --- the cost is low</text><text x="414.0" y="112" font-size="10" font-weight="normal" text-anchor="start" fill="#111">right: a new line every step --- the cost rises, then flattens</text><rect x="90" y="322" width="620" height="62" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="390.0" y="344" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">that a line is 64 bytes shows up directly in the time</text><text x="390.0" y="362" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">ask for 8 bytes and the machine still fetches 64</text><text x="390.0" y="378" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">-&gt; so how things are laid out settles the cost as much as what is read</text></svg>