<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" height="250" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="700" height="250" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><rect x="100" y="86" width="220" height="68" fill="none" stroke="#111" stroke-width="2.4"/><text x="210" y="114" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">pointer value</text><text x="210" y="138" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#444">can be copied and compared</text><rect x="430" y="46" width="240" height="52" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="5 3"/><text x="550" y="68" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111">address</text><text x="550" y="86" font-size="11" font-weight="normal" text-anchor="middle" fill="#444">which place it points at</text><line x1="322" y1="120" x2="428" y2="72" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="430" y="112" width="240" height="52" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="5 3"/><text x="550" y="134" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111">pointed-at type</text><text x="550" y="152" font-size="11" font-weight="normal" text-anchor="middle" fill="#444">how many bytes, through what eye</text><line x1="322" y1="120" x2="428" y2="138" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="430" y="178" width="240" height="52" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="5 3"/><text x="550" y="200" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111">provenance</text><text 