<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="780" height="430" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="390.0" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">booting is a chain --- each link finds the next, checks it, and hands over</text><text x="40" y="56" font-size="12" font-weight="bold" text-anchor="start" fill="#111">DOS (BIOS)</text><rect x="40" y="70" width="150" height="62" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="115" y="96" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">power, POST</text><line x1="190" y1="101" x2="228" y2="101" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="230" y="70" width="150" height="62" fill="none" stroke="#111" stroke-width="1.6"/><text x="305" y="90" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">boot sector</text><text x="305" y="106" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">0x7C00</text><line x1="380" y1="101" x2="418" y2="101" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="420" y="70" width="150" height="62" fill="none" stroke="#111" stroke-width="1.6"/><text x="495" y="90" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">IO.SYS</text><text x="495" y="106" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">MSDOS.SYS</text><line x1="570" y1="101" x2="608" y2="101" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="610" y="70" width="150" height="62" fill="none" stroke="#111" stroke-width="1.6"/><text x="685" y="96" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">COMMAND.COM</text><text x="40" y="176" font-size="12" font-weight="bold" text-anchor="start" fill="#111">Linux (UEFI)</text><rect x="40" y="190" width="150" height="62" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="115" y="216" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">power, firmware</text><line x1="190" y1="221" x2="228" y2="221" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="230" y="190" width="150" height="62" fill="none" stroke="#111" stroke-width="1.6"/><text x="305" y="210" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">.efi on the ESP</text><text x="305" y="226" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">(PE format)</text><line x1="380" y1="221" x2="418" y2="221" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="420" y="190" width="150" height="62" fill="none" stroke="#111" stroke-width="1.6"/><text x="495" y="216" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">kernel + initramfs</text><line x1="570" y1="221" x2="608" y2="221" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="610" y="190" width="150" height="62" fill="none" stroke="#111" stroke-width="1.6"/><text x="685" y="216" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">PID 1 (init)</text><text x="40" y="296" font-size="12" font-weight="bold" text-anchor="start" fill="#111">embedded RTOS</text><rect x="40" y="310" width="150" height="62" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="115" y="336" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">power, reset vector</text><line x1="190" y1="341" x2="228" y2="341" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="230" y="310" width="150" height="62" fill="none" stroke="#111" stroke-width="1.6"/><text x="305" y="336" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">boot ROM / SPL</text><line x1="380" y1="341" x2="418" y2="341" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="420" y="310" width="150" height="62" fill="none" stroke="#111" stroke-width="1.6"/><text x="495" y="330" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">bootloader</text><text x="495" y="346" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">(signature check)</text><line x1="570" y1="341" x2="608" y2="341" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="610" y="310" width="150" height="62" fill="none" stroke="#111" stroke-width="1.6"/><text x="685" y="330" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">firmware image</text><text x="685" y="346" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">= app + kernel</text><rect x="40" y="380" width="700" height="40" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="390.0" y="396" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">every link does the same work --- find the next, load it, check it, hand over control</text><text x="390.0" y="412" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">the previous link usually disappears --- so what is handed over becomes the contract (command line, memory map, device tree)</text></svg>