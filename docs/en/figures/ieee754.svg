<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="760" height="290" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="40" y="18" font-size="12.5" font-weight="bold" text-anchor="start" fill="#111">float — 32 bits</text><rect x="40" y="62" width="21.25" height="46" fill="none" stroke="#111" stroke-width="1.6"/><text x="50.625" y="40" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">sign</text><line x1="50.625" y1="44" x2="50.625" y2="59" stroke="#111" stroke-width="1"/><text x="50.625" y="100" font-size="11" font-weight="normal" text-anchor="middle" fill="#444">1</text><rect x="61.25" y="62" width="170.0" height="46" fill="url(#hatch)" stroke="#111" stroke-width="1.6"/><text x="146.25" y="83" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111">exponent</text><text x="146.25" y="100" font-size="11" font-weight="normal" text-anchor="middle" fill="#444">8</text><rect x="231.25" y="62" width="488.75" height="46" fill="none" stroke="#111" stroke-width="1.6"/><text x="475.625" y="83" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111">fraction</text><text x="475.625" y="100" font-size="11" font-weight="normal" text-anchor="middle" fill="#444">23</text><text x="40" y="146" font-size="12.5" font-weight="bold" text-anchor="start" fill="#111">double — 64 bits</text><rect x="40" y="190" width="10.625" height="46" fill="none" stroke="#111" stroke-width="1.6"/><text x="45.3125" y="168" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">sign</text><line x1="45.3125" y1="172" x2="45.3125" y2="187" stroke="#111" stroke-width="1"/><text x="45.3125" y="228" font-size="11" font-weight="normal" text-anchor="middle" fill="#444">1</text><rect x="50.625" y="190" width="116.875" height="46" fill="url(#hatch)" stroke="#111" stroke-width="1.6"/><text x="109.0625" y="211" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111">exponent</text><text x="109.0625" y="228" font-size="11" font-weight="normal" text-anchor="middle" fill="#444">11</text><rect x="167.5" y="190" width="552.5" height="46" fill="none" stroke="#111" stroke-width="1.6"/><text x="443.75" y="211" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111">fraction</text><text x="443.75" y="228" font-size="11" font-weight="normal" text-anchor="middle" fill="#444">52</text><text x="40" y="268" font-size="11.5" font-weight="normal" text-anchor="start" fill="#444">The exponent is stored with a bias; the leading 1 of the fraction is not stored (the hidden bit).</text></svg>