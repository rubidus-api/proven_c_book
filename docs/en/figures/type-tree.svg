<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="760" height="430" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="380.0" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">how the standard divides types (§6.2.5)</text><rect x="320" y="36" width="120" height="30" fill="none" stroke="#111" stroke-width="1.6"/><text x="380" y="56" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">type</text><rect x="150" y="92" width="160" height="30" fill="none" stroke="#111" stroke-width="1.6"/><text x="230" y="112" font-size="12" font-weight="normal" text-anchor="middle" fill="#111">object type</text><rect x="470" y="92" width="160" height="30" fill="none" stroke="#111" stroke-width="1.6"/><text x="550" y="112" font-size="12" font-weight="normal" text-anchor="middle" fill="#111">function type</text><line x1="370" y1="66" x2="250" y2="90" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="390" y1="66" x2="530" y2="90" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="60" y="152" width="175" height="28" fill="none" stroke="#111" stroke-width="1.6"/><text x="147" y="171" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">arithmetic type</text><rect x="255" y="152" width="260" height="28" fill="none" stroke="#111" stroke-width="1.6"/><text x="385" y="171" font-size="12" font-weight="normal" text-anchor="middle" fill="#111">pointer, array, struct, union, void</text><line x1="210" y1="122" x2="160" y2="150" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="250" y1="122" x2="340" y2="150" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="30" y="208" width="120" height="26" fill="none" stroke="#111" stroke-width="1.6"/><text x="90" y="226" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">integer types</text><rect x="160" y="208" width="120" height="26" fill="none" stroke="#111" stroke-width="1.6"/><text x="220" y="226" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">floating types</text><line x1="130" y1="180" x2="95" y2="206" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="165" y1="180" x2="215" y2="206" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="20" y="258" width="195.08203125" height="24" fill="none" stroke="#111" stroke-width="1.6"/><text x="117.541015625" y="275" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">char / signed char / unsigned char</text><rect x="20" y="288" width="195.08203125" height="24" fill="none" stroke="#111" stroke-width="1.6"/><text x="117.541015625" y="305" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">signed integer types (short, int, long…)</text><rect x="20" y="318" width="195.08203125" height="24" fill="none" stroke="#111" stroke-width="1.6"/><text x="117.541015625" y="335" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">unsigned integer types (bool included)</text><rect x="20" y="348" width="195.08203125" height="24" fill="none" stroke="#111" stroke-width="1.6"/><text x="117.541015625" y="365" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">enumerated types</text><line x1="90" y1="234" x2="90" y2="256" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="300" y="208" width="215" height="26" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="407" y="226" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">real types = integer + real floating</text><rect x="300" y="248" width="215" height="26" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="407" y="266" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">scalar = arithmetic + pointer + nullptr_t</text><rect x="300" y="288" width="215" height="26" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="407" y="306" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">aggregate = array + struct (not union)</text><rect x="300" y="328" width="215" height="26" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="407" y="346" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">basic types = char + integer + floating</text><rect x="545" y="152" width="195" height="28" fill="none" stroke="#111" stroke-width="1.6"/><text x="642" y="171" font-size="12" font-weight="normal" text-anchor="middle" fill="#111">derived types</text><line x1="560" y1="122" x2="620" y2="150" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="555" y="196" width="175" height="24" fill="none" stroke="#111" stroke-width="1.6"/><text x="642.5" y="213" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">array, struct, union</text><rect x="555" y="226" width="175" height="24" fill="none" stroke="#111" stroke-width="1.6"/><text x="642.5" y="243" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">function, pointer</text><rect x="555" y="256" width="175" height="24" fill="none" stroke="#111" stroke-width="1.6"/><text x="642.5" y="273" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">atomic (_Atomic)</text><line x1="642.5" y1="180" x2="642.5" y2="194" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text x="380.0" y="416" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">a dashed box is a collective name — not a branch of the tree but a word gathering several.</text></svg>