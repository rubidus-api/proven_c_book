<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="760" height="330" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="380.0" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">where the devices sit --- two designs</text><text x="180" y="52" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">memory-mapped I/O</text><rect x="60" y="64" width="100" height="210" fill="none" stroke="#111" stroke-width="1.6"/><text x="110" y="80" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">CPU</text><text x="110" y="100" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">load and store</text><text x="110" y="116" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">with one instruction</text><line x1="160" y1="130" x2="208" y2="130" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="210" y="64" width="90" height="210" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="255" y="80" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">address decoder</text><rect x="310" y="82" width="90" height="34" fill="none" stroke="#111" stroke-width="1.6"/><text x="355" y="104" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">RAM</text><line x1="300" y1="130" x2="308" y2="100" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="310" y="132" width="90" height="34" fill="none" stroke="#111" stroke-width="1.6"/><text x="355" y="154" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">UART</text><line x1="300" y1="130" x2="308" y2="150" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="310" y="182" width="90" height="34" fill="none" stroke="#111" stroke-width="1.6"/><text x="355" y="204" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">timer</text><line x1="300" y1="130" x2="308" y2="200" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="310" y="227" width="90" height="34" fill="none" stroke="#111" stroke-width="1.6"/><text x="355" y="249" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">...</text><line x1="300" y1="130" x2="308" y2="245" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text x="180" y="300" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">one address space --- a pointer reaches it directly</text><text x="600" y="52" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">port-mapped I/O</text><rect x="453.859375" y="64" width="116.140625" height="210" fill="none" stroke="#111" stroke-width="1.6"/><text x="511.9296875" y="80" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">CPU</text><text x="511.9296875" y="100" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">dedicated instructions</text><text x="511.9296875" y="116" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">in / out</text><line x1="570" y1="110" x2="618" y2="110" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="620" y="88" width="110" height="44" fill="none" stroke="#111" stroke-width="1.6"/><text x="675" y="106" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">I/O space</text><text x="675" y="122" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">64 KiB, separate</text><line x1="511.9296875" y1="274" x2="511.9296875" y2="300" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="620" y="170" width="110" height="44" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="675" y="188" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">memory space</text><text x="675" y="204" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">load and store</text><line x1="570" y1="190" x2="618" y2="190" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text x="600" y="300" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">two spaces --- C syntax cannot reach one of them</text></svg>