<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="760" height="380" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="380.0" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">two ways of sending the same byte</text><text x="40" y="56" font-size="12" font-weight="bold" text-anchor="start" fill="#111">serial --- bits in a queue on one wire</text><rect x="40" y="66" width="90" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="85" y="91" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">sender</text><rect x="630" y="66" width="90" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="675" y="91" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">receiver</text><line x1="130" y1="86" x2="630" y2="86" stroke="#111" stroke-width="1.6"/><rect x="150" y="72" width="50" height="28" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="175" y="91" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">1</text><rect x="208" y="72" width="50" height="28" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="233" y="91" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">0</text><rect x="266" y="72" width="50" height="28" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="291" y="91" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">1</text><rect x="324" y="72" width="50" height="28" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="349" y="91" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">1</text><rect x="382" y="72" width="50" height="28" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="407" y="91" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">0</text><rect x="440" y="72" width="50" height="28" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="465" y="91" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">0</text><rect x="498" y="72" width="50" height="28" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="523" y="91" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">1</text><rect x="556" y="72" width="50" height="28" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="581" y="91" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">0</text><text x="380.0" y="122" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">time →   the bits flow *in turn* · few wires · one bit per clock</text><text x="40" y="166" font-size="12" font-weight="bold" text-anchor="start" fill="#111">parallel --- eight bits at once on eight wires</text><rect x="40" y="176" width="90" height="130" fill="none" stroke="#111" stroke-width="1.6"/><text x="85" y="245" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">sender</text><rect x="630" y="176" width="90" height="130" fill="none" stroke="#111" stroke-width="1.6"/><text x="675" y="245" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">receiver</text><line x1="130" y1="186" x2="630" y2="186" stroke="#111" stroke-width="1.2"/><text x="380" y="183" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">1</text><line x1="130" y1="201" x2="630" y2="201" stroke="#111" stroke-width="1.2"/><text x="380" y="198" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">0</text><line x1="130" y1="216" x2="630" y2="216" stroke="#111" stroke-width="1.2"/><text x="380" y="213" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">1</text><line x1="130" y1="231" x2="630" y2="231" stroke="#111" stroke-width="1.2"/><text x="380" y="228" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">1</text><line x1="130" y1="246" x2="630" y2="246" stroke="#111" stroke-width="1.2"/><text x="380" y="243" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">0</text><line x1="130" y1="261" x2="630" y2="261" stroke="#111" stroke-width="1.2"/><text x="380" y="258" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">0</text><line x1="130" y1="276" x2="630" y2="276" stroke="#111" stroke-width="1.2"/><text x="380" y="273" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">1</text><line x1="130" y1="291" x2="630" y2="291" stroke="#111" stroke-width="1.2"/><text x="380" y="288" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">0</text><text x="380.0" y="322" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">eight bits per clock --- but all eight must arrive at *the same instant*</text><rect x="40" y="336" width="680" height="36" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="380.0" y="352" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">the faster it goes the more parallel loses --- once the spread in arrival times (skew)</text><text x="380.0" y="366" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">grows larger than one bit's time, the eight lines cannot be lined up</text></svg>