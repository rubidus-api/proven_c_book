<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" width="760" height="272" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="760" height="272" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="380.0" y="24" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">what an array loses when it decays to a pointer</text><text x="60" y="64" font-size="12" font-weight="bold" text-anchor="start" fill="#111">int a[5]</text><rect x="60" y="78" width="52" height="44" fill="none" stroke="#111" stroke-width="1.6"/><text x="86.0" y="106" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">a[0]</text><rect x="112" y="78" width="52" height="44" fill="none" stroke="#111" stroke-width="1.6"/><text x="138.0" y="106" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">a[1]</text><rect x="164" y="78" width="52" height="44" fill="none" stroke="#111" stroke-width="1.6"/><text x="190.0" y="106" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">a[2]</text><rect x="216" y="78" width="52" height="44" fill="none" stroke="#111" stroke-width="1.6"/><text x="242.0" y="106" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">a[3]</text><rect x="268" y="78" width="52" height="44" fill="none" stroke="#111" stroke-width="1.6"/><text x="294.0" y="106" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">a[4]</text><text x="60" y="186" font-size="11" font-weight="normal" text-anchor="start" fill="#111">type: int[5]</text><text x="60" y="206" font-size="11" font-weight="normal" text-anchor="start" fill="#111">sizeof a = 20</text><text x="470" y="64" font-size="12" font-weight="bold" text-anchor="start" fill="#111">int *p = a;</text><rect x="470" y="78" width="120" height="44" fill="none" stroke="#111" stroke-width="1.6"/><text x="530" y="106" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">the address of a[0]</text><text x="470" y="186" font-size="11" font-weight="normal" text-anchor="start" fill="#111">type: int *</text><text x="470" y="206" font-size="11" font-weight="normal" text-anchor="start" fill="#111">sizeof p = 8</text><line x1="478" y1="122" x2="478" y2="152" stroke="#111" stroke-width="1.8"/><line x1="478" y1="152" x2="86.0" y2="152" stroke="#111" stroke-width="1.8"/><line x1="86.0" y1="152" x2="86.0" y2="126" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><text x="305.0" y="144" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">the same address</text><text x="380.0" y="232" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">what is lost: how many elements there are</text><text x="380.0" y="252" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#111">the address is the same and the type is not, which is why sizeof cannot give a length inside a function.</text></svg>