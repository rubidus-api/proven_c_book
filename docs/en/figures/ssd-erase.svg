<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="780" height="400" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="390.0" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">an SSD writes in one unit and erases in another</text><text x="40" y="56" font-size="12" font-weight="bold" text-anchor="start" fill="#111">1. one block holds many pages</text><rect x="60" y="68" width="660" height="60" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="390" y="62" font-size="9" font-weight="bold" text-anchor="middle" fill="#111">erase unit = a block (several MiB)</text><rect x="75" y="78" width="70" height="40" fill="#ececec" stroke="#111" stroke-width="1.6"/><text x="110" y="96" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">page 1</text><text x="110" y="110" font-size="8" font-weight="normal" text-anchor="middle" fill="#111">used</text><rect x="156" y="78" width="70" height="40" fill="#ececec" stroke="#111" stroke-width="1.6"/><text x="191" y="96" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">page 2</text><text x="191" y="110" font-size="8" font-weight="normal" text-anchor="middle" fill="#111">used</text><rect x="237" y="78" width="70" height="40" fill="#ececec" stroke="#111" stroke-width="1.6"/><text x="272" y="96" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">page 3</text><text x="272" y="110" font-size="8" font-weight="normal" text-anchor="middle" fill="#111">used</text><rect x="318" y="78" width="70" height="40" fill="#ececec" stroke="#111" stroke-width="1.6"/><text x="353" y="96" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">page 4</text><text x="353" y="110" font-size="8" font-weight="normal" text-anchor="middle" fill="#111">used</text><rect x="399" y="78" width="70" height="40" fill="#ececec" stroke="#111" stroke-width="1.6"/><text x="434" y="96" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">page 5</text><text x="434" y="110" font-size="8" font-weight="normal" text-anchor="middle" fill="#111">used</text><rect x="480" y="78" width="70" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="515" y="96" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">page 6</text><text x="515" y="110" font-size="8" font-weight="normal" text-anchor="middle" fill="#111">free</text><rect x="561" y="78" width="70" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="596" y="96" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">page 7</text><text x="596" y="110" font-size="8" font-weight="normal" text-anchor="middle" fill="#111">free</text><rect x="642" y="78" width="70" height="40" fill="none" stroke="#111" stroke-width="1.6"/><text x="677" y="96" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">page 8</text><text x="677" y="110" font-size="8" font-weight="normal" text-anchor="middle" fill="#111">free</text><text x="390" y="142" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">write unit = a page (several KiB) · reads are by page too</text><text x="40" y="176" font-size="12" font-weight="bold" text-anchor="start" fill="#111">2. you want to change one page --- but it cannot be overwritten in place</text><rect x="60" y="194" width="150" height="46" fill="none" stroke="#111" stroke-width="1.6"/><text x="135" y="220" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">read the page</text><line x1="210" y1="217" x2="238" y2="217" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="240" y="194" width="150" height="46" fill="none" stroke="#111" stroke-width="1.6"/><text x="315" y="220" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">write a fresh page</text><line x1="390" y1="217" x2="418" y2="217" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="420" y="194" width="150" height="46" fill="none" stroke="#111" stroke-width="1.6"/><text x="495" y="220" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">mark the old one dead</text><line x1="570" y1="217" x2="598" y2="217" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><rect x="600" y="194" width="150" height="46" fill="none" stroke="#111" stroke-width="1.6"/><text x="675" y="220" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">erase the block later</text><text x="40" y="274" font-size="12" font-weight="bold" text-anchor="start" fill="#111">3. hence write amplification</text><rect x="60" y="286" width="660" height="46" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="390" y="306" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">to change 4 KiB -&gt; a block (several MiB) is rewritten and erased</text><text x="390" y="324" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">bytes actually written / bytes asked for = write amplification</text><rect x="60" y="344" width="660" height="44" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="390" y="364" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">TRIM is the signal that says this page is no longer in use</text><text x="390" y="380" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">knowing in advance lets it tidy up while idle, so writes do not slow down</text></svg>