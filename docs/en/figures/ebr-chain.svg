<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="780" height="330" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="390.0" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">the EBR chain of an extended partition --- two different bases confuse it</text><rect x="30" y="60" width="110" height="50" fill="#e8e8e8" stroke="#111" stroke-width="1.6"/><text x="85" y="80" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">MBR</text><text x="85" y="96" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">LBA 0</text><rect x="150" y="60" width="600" height="50" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="450" y="78" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">the extended partition (MBR entry 4, type 0x0F)</text><text x="450" y="96" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">start LBA = E</text><rect x="170" y="140" width="90" height="44" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="215" y="160" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">EBR 1</text><text x="215" y="176" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">LBA E</text><rect x="400" y="140" width="90" height="44" fill="#f5f5f5" stroke="#111" stroke-width="1.6"/><text x="445" y="160" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">EBR 2</text><text x="445" y="176" font-size="9" font-weight="normal" text-anchor="middle" fill="#111">LBA E + d</text><rect x="270" y="140" width="120" height="44" fill="none" stroke="#111" stroke-width="1.6"/><text x="330" y="166" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">logical 1</text><rect x="500" y="140" width="120" height="44" fill="none" stroke="#111" stroke-width="1.6"/><text x="560" y="166" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">logical 2</text><line x1="260" y1="162" x2="268" y2="162" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="490" y1="162" x2="498" y2="162" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="215" y1="184" x2="445" y2="184" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text x="215" y="210" font-size="10" font-weight="bold" text-anchor="start" fill="#111">1. entry 1 = the logical partition right behind it</text><text x="215" y="226" font-size="10" font-weight="normal" text-anchor="start" fill="#111">base = this EBR itself (relative LBA + the EBR's place)</text><text x="215" y="250" font-size="10" font-weight="bold" text-anchor="start" fill="#111">2. entry 2 = the next EBR</text><text x="215" y="266" font-size="10" font-weight="normal" text-anchor="start" fill="#111">base = the start of the extended partition, E (relative LBA + E)</text><rect x="30" y="286" width="720" height="34" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="390.0" y="308" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">two entries of one table with different bases --- the most misread place when doing it by hand</text></svg>