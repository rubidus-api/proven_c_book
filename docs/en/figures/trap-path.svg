<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><rect width="760" height="250" fill="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1" opacity="0.35"/></pattern></defs><text x="380.0" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">what happens when you divide by zero --- four steps</text><rect x="40" y="70" width="150" height="60" fill="none" stroke="#111" stroke-width="1.6"/><text x="115" y="92" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">1. my C code</text><text x="115" y="112" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">x / zero</text><rect x="220" y="70" width="150" height="60" fill="none" stroke="#111" stroke-width="1.6"/><text x="295" y="92" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">2. the CPU</text><text x="295" y="112" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">raises an exception</text><rect x="400" y="70" width="150" height="60" fill="none" stroke="#111" stroke-width="1.6"/><text x="475" y="92" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">3. the kernel</text><text x="475" y="112" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">the trap handler receives it</text><rect x="580" y="70" width="150" height="60" fill="none" stroke="#111" stroke-width="1.6"/><text x="655" y="92" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">4. my C function</text><text x="655" y="112" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">the signal handler</text><line x1="190" y1="100" x2="218" y2="100" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="370" y1="100" x2="398" y2="100" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><line x1="550" y1="100" x2="578" y2="100" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text x="380.0" y="160" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">and on return? --- it retries the same instruction, so it faults again, forever.</text><text x="380.0" y="182" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">the standard says as much: returning from such a handler is undefined behaviour.</text><line x1="655" y1="138" x2="655" y2="200" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/><text x="655" y="218" font-size="10" font-weight="bold" text-anchor="middle" fill="#111">leave through siglongjmp</text></svg>